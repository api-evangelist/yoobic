openapi: 3.2.0
info:
  title: YOOBIC Public Missions API
  version: ''
  description: Welcome to the **YOOBIC Public API** documentation.
servers:
- url: https://<base_url>/
tags:
- name: Missions
  description: Missions are the basic campaign type.
paths:
  /public/api/missions/{id}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_id:
                    type: string
                  title:
                    type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                  campaign_id:
                    type: string
                  user_id:
                    type: string
                  creator_id:
                    type: string
                  store_id:
                    type: string
                  score:
                    type: object
                    properties:
                      title:
                        type: string
                      value:
                        type: number
                  extra_scores:
                    type: object
                    properties:
                      score1:
                        type: object
                        properties:
                          title:
                            type: string
                          value:
                            type: number
                  republish_count:
                    type: string
                  reason_noncompliant:
                    type: string
                  finished_date:
                    type: string
                  validated_date:
                    type: string
                  compliant:
                    type: boolean
                  status:
                    type: string
                  type:
                    type: string
                  answers:
                    type: array
                    items:
                      type: object
                      properties:
                        question_id:
                          type: string
                        question_type:
                          type: string
                        question:
                          type: string
                        answer:
                          type: array
                          items:
                            type: string
                        page_number:
                          type: number
                        question_number:
                          type: number
                      required:
                      - question_id
                      - question_type
                      - question
                      - answer
                      - page_number
                      - question_number
                  task_number:
                    type: number
                example:
                  mission_id: 54ab03c6546847ee0d30084a
                  title: Rockets mission 1
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
                  campaign_id: 54ab03c6546847ee0d30088a
                  user_id: 54ab03c6546847ee0d30089a
                  creator_id: 54ab03c6546847ee0d30089a
                  store_id: 54ab03c6546847ee0d30081a
                  score:
                    title: my score
                    value: 10
                  extra_scores:
                    score1:
                      title: my score2
                      value: 8
                  republish_count: '2'
                  reason_noncompliant: missing photo
                  finished_date: '2018-05-29T04:51:40.862Z'
                  validated_date: '2018-05-30T04:51:40.862Z'
                  compliant: true
                  status: finished
                  type: mission
                  answers:
                  - question_id: e8335f8d-109d-475f-b10b-113ce6876dc7
                    question_type: number
                    question: number of ice-cream flavors
                    answer: 2
                    page_number: 1
                    question_number: 1
                  - question_id: e8335f8d-109d-475f-b10b-113ce6876dc8
                    question_type: text
                    question: ice-cream flavors
                    answer:
                    - chocolate
                    - vanilla
                    page_number: 1
                    question_number: 2
                  task_number: 1
              examples:
                response:
                  value:
                    mission_id: 54ab03c6546847ee0d30084a
                    title: Rockets mission 1
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
                    campaign_id: 54ab03c6546847ee0d30088a
                    user_id: 54ab03c6546847ee0d30089a
                    creator_id: 54ab03c6546847ee0d30089a
                    store_id: 54ab03c6546847ee0d30081a
                    score:
                      title: my score
                      value: 10
                    extra_scores:
                      score1:
                        title: my score2
                        value: 8
                    republish_count: '2'
                    reason_noncompliant: missing photo
                    finished_date: '2018-05-29T04:51:40.862Z'
                    validated_date: '2018-05-30T04:51:40.862Z'
                    compliant: true
                    status: finished
                    type: mission
                    answers:
                    - question_id: e8335f8d-109d-475f-b10b-113ce6876dc7
                      question_type: number
                      question: number of ice-cream flavors
                      answer: 2
                      page_number: 1
                      question_number: 1
                    - question_id: e8335f8d-109d-475f-b10b-113ce6876dc8
                      question_type: text
                      question: ice-cream flavors
                      answer:
                      - chocolate
                      - vanilla
                      page_number: 1
                      question_number: 2
                    task_number: 1
      summary: Get
      operationId: Get
      description: Get a mission for the given id.
      tags:
      - Missions
      parameters:
      - name: id
        in: path
        description: The id of the mission
        required: true
        example: 54ab03c6546847ee0d30084a
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
    delete:
      responses:
        '204':
          description: No Content
          headers: {}
      summary: Delete
      operationId: Delete
      description: Delete a mission by id.
      tags:
      - Missions
      parameters:
      - name: id
        in: path
        description: The id of the mission
        required: true
        example: 54ab03c6546847ee0d30084a
        schema:
          type: string
      security:
      - oauth2: []
    patch:
      responses:
        '200':
          description: OK
          headers: {}
      summary: Partial Update
      operationId: Partial Update
      description: Update a subset of properties of a mission
      tags:
      - Missions
      parameters:
      - name: id
        in: path
        description: The id of the mission
        required: true
        example: 54ab03c6546847ee0d30084a
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: object
                  properties:
                    title:
                      type: string
                    value:
                      type: number
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      question_id:
                        type: string
                      answer:
                        type: array
                        items:
                          type: string
                      question_type:
                        type: string
                      question:
                        type: string
                      page_number:
                        type: number
                    required:
                    - answer
              example:
                score:
                  title: my other score
                  value: 20
                answers:
                - question_id: e8335f8d-109d-475f-b10b-113ce6876dc7
                  answer: 3
                - question_type: text
                  question: ice-cream flavors
                  answer:
                  - chocolate
                  - vanilla
                  - strawberry
                  page_number: 1
      security:
      - oauth2: []
  /public/api/missions/{id}/tasks:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_id:
                    type: string
                  title:
                    type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                  campaign_id:
                    type: string
                  user_id:
                    type: string
                  creator_id:
                    type: string
                  store_id:
                    type: string
                  todo:
                    type: object
                    properties:
                      user_id:
                        type: string
                      tasks:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: string
                example:
                  mission_id: 54ab03c6546847ee0d30084b
                  title: Action plans
                  created_date: '2021-05-10T09:21:40.232Z'
                  updated_date: '2021-05-10T09:21:40.232Z'
                  campaign_id: 54ab03c6546847ee0d30088b
                  user_id: 5fbea9662804f40033935d9b
                  creator_id: 54ab03c6546847ee0d30089a
                  store_id: 54ab03c6546847ee0d30081a
                  todo:
                    user_id: 5fbea9662804f40033935d9b
                    tasks:
                    - value: TEST
              examples:
                response:
                  value:
                    mission_id: 54ab03c6546847ee0d30084b
                    title: Action plans
                    created_date: '2021-05-10T09:21:40.232Z'
                    updated_date: '2021-05-10T09:21:40.232Z'
                    campaign_id: 54ab03c6546847ee0d30088b
                    user_id: 5fbea9662804f40033935d9b
                    creator_id: 54ab03c6546847ee0d30089a
                    store_id: 54ab03c6546847ee0d30081a
                    todo:
                      user_id: 5fbea9662804f40033935d9b
                      tasks:
                      - value: TEST
      summary: Find mission's tasks
      operationId: Find mission's tasks
      description: Find the tasks for missions of type `todo`
      tags:
      - Missions
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
    put:
      responses:
        '200':
          description: OK
          headers: {}
      summary: Replace mission's tasks
      operationId: Replace mission's tasks
      description: 'Update the tasks on a mission of type `todo`.

        The `todo` object must contain *all* the tasks defined with the new values.

        Once updated the status of the mission is set to `finished`.'
      tags:
      - Missions
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/missions/{id}/book:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_id:
                    type: string
                  title:
                    type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                  campaign_id:
                    type: string
                  user_id:
                    type: string
                  store_id:
                    type: string
                  status:
                    type: string
                  type:
                    type: string
                example:
                  mission_id: 54ab03c6546847ee0d30084a
                  title: Rockets mission 1
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
                  campaign_id: 54ab03c6546847ee0d30088a
                  user_id: 54ab03c6546847ee0d30089a
                  store_id: 54ab03c6546847ee0d30081a
                  status: booked
                  type: mission
              examples:
                response:
                  value:
                    mission_id: 54ab03c6546847ee0d30084a
                    title: Rockets mission 1
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
                    campaign_id: 54ab03c6546847ee0d30088a
                    user_id: 54ab03c6546847ee0d30089a
                    store_id: 54ab03c6546847ee0d30081a
                    status: booked
                    type: mission
      summary: Book
      operationId: Book
      description: 'Book an available mission.


        **Important**

        The mission must be assigned before booking: error message: "Mission must have an assigned user before it can be booked. Please call the assign endpoint prior to booking the mission."


        If the mission was republished with answers during the validation of a non-compliant mission, the booked mission will contain:


        * `original_mission_id`


        * `original_reason_noncompliant`


        * `original_mission_answers`


        The `original_mission_answers` can be used as a starting point for the answers provided to `/missions/{id}/finish`.'
      tags:
      - Missions
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/missions/{id}/unbook:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_id:
                    type: string
                  title:
                    type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                  campaign_id:
                    type: string
                  store_id:
                    type: string
                  type:
                    type: string
                example:
                  mission_id: 54ab03c6546847ee0d30084a
                  title: Rockets mission 1
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
                  campaign_id: 54ab03c6546847ee0d30088a
                  store_id: 54ab03c6546847ee0d30081a
                  type: mission
              examples:
                response:
                  value:
                    mission_id: 54ab03c6546847ee0d30084a
                    title: Rockets mission 1
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
                    campaign_id: 54ab03c6546847ee0d30088a
                    store_id: 54ab03c6546847ee0d30081a
                    type: mission
      summary: Unbook
      operationId: Unbook
      description: 'Unbook a mission.


        Make available a mission that was previously booked.'
      tags:
      - Missions
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/missions/{id}/assign:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_id:
                    type: string
                  title:
                    type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                  campaign_id:
                    type: string
                  user_id:
                    type: string
                  creator_id:
                    type: string
                  store_id:
                    type: string
                  status:
                    type: string
                  type:
                    type: string
                example:
                  mission_id: 54ab03c6546847ee0d30084a
                  title: Rockets mission 1
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
                  campaign_id: 54ab03c6546847ee0d30088a
                  user_id: 53fb03c6546847fe0d30186b
                  creator_id: 54ab03c6546847ee0d30089a
                  store_id: 54ab03c6546847ee0d30081a
                  status: booked
                  type: mission
              examples:
                response:
                  value:
                    mission_id: 54ab03c6546847ee0d30084a
                    title: Rockets mission 1
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
                    campaign_id: 54ab03c6546847ee0d30088a
                    user_id: 53fb03c6546847fe0d30186b
                    creator_id: 54ab03c6546847ee0d30089a
                    store_id: 54ab03c6546847ee0d30081a
                    status: booked
                    type: mission
      summary: Assign
      operationId: Assign
      description: Assign an available mission to a user whose `user_id` is provided.
      tags:
      - Missions
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/missions/{id}/unassign:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_id:
                    type: string
                  title:
                    type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                  campaign_id:
                    type: string
                  store_id:
                    type: string
                  status:
                    type: string
                  type:
                    type: string
                example:
                  mission_id: 54ab03c6546847ee0d30084a
                  title: Rockets mission 1
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
                  campaign_id: 54ab03c6546847ee0d30088a
                  store_id: 54ab03c6546847ee0d30081a
                  status: booked
                  type: mission
              examples:
                response:
                  value:
                    mission_id: 54ab03c6546847ee0d30084a
                    title: Rockets mission 1
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
                    campaign_id: 54ab03c6546847ee0d30088a
                    store_id: 54ab03c6546847ee0d30081a
                    status: booked
                    type: mission
      summary: Unassign
      operationId: Unassign
      description: 'Unassign a mission.


        Make available a mission that was previously assigned.

        **Important:**

        Only the user that previously assigned the mission can unassign it.'
      tags:
      - Missions
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/missions/{id}/finish:
    post:
      responses:
        '200':
          description: OK
          headers: {}
      summary: Finish
      operationId: Finish
      description: 'Finish a mission.


        The body should only contain an `answers` field as an array.'
      tags:
      - Missions
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/missions/{id}/validate:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  validated_mission:
                    type: object
                    properties:
                      mission_id:
                        type: string
                      title:
                        type: string
                      created_date:
                        type: string
                      updated_date:
                        type: string
                      campaign_id:
                        type: string
                      user_id:
                        type: string
                      creator_id:
                        type: string
                      store_id:
                        type: string
                      finished_date:
                        type: string
                      status:
                        type: string
                      compliant:
                        type: boolean
                      validated_date:
                        type: string
                      rating:
                        type: number
                      republish_count:
                        type: string
                      type:
                        type: string
                example:
                  validated_mission:
                    mission_id: 54ab03c6546847ee0d30084a
                    title: Rockets mission 1
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
                    campaign_id: 54ab03c6546847ee0d30088a
                    user_id: 54ab03c6546847ee0d30089a
                    creator_id: 54ab03c6546847ee0d30089a
                    store_id: 54ab03c6546847ee0d30081a
                    finished_date: '2018-05-29T04:51:40.862Z'
                    status: finished
                    compliant: true
                    validated_date: '2018-05-30T04:51:40.862Z'
                    rating: 100
                    republish_count: '3'
                    type: mission
              examples:
                response:
                  value:
                    validated_mission:
                      mission_id: 54ab03c6546847ee0d30084a
                      title: Rockets mission 1
                      created_date: '2018-05-23T04:51:40.862Z'
                      updated_date: '2018-05-23T04:51:40.862Z'
                      campaign_id: 54ab03c6546847ee0d30088a
                      user_id: 54ab03c6546847ee0d30089a
                      creator_id: 54ab03c6546847ee0d30089a
                      store_id: 54ab03c6546847ee0d30081a
                      finished_date: '2018-05-29T04:51:40.862Z'
                      status: finished
                      compliant: true
                      validated_date: '2018-05-30T04:51:40.862Z'
                      rating: 100
                      republish_count: '3'
                      type: mission
      summary: Validate
      operationId: Validate
      description: 'Validate a mission.


        #### Fields


        | Field | Format | Required | Description |

        |--------------------------------|--------------|:--------:|-----------------|

        |`compliant` | boolean | x | Validated if true, rejected otherwise. |

        |`rating` | number | | Rating of the mission. |

        |`republish` | boolean | | If true, republish this mission. |

        |`republish_with_answers` | boolean | | If `republish` is true, control whether or not to prefill the republished mission with previous mission answers. |

        |`reason_noncompliant` | string | | Explanation why the mission was not compliant. |

        |`reason_noncompliant_key` | string | | Explanation key. |'
      tags:
      - Missions
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/missions/{id}/archive:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_id:
                    type: string
                  title:
                    type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                  campaign_id:
                    type: string
                  user_id:
                    type: string
                  creator_id:
                    type: string
                  store_id:
                    type: string
                  score:
                    type: object
                    properties:
                      title:
                        type: string
                      value:
                        type: number
                  extra_scores:
                    type: object
                    properties:
                      score1:
                        type: object
                        properties:
                          title:
                            type: string
                          value:
                            type: number
                  republish_count:
                    type: string
                  reason_noncompliant:
                    type: string
                  finished_date:
                    type: string
                  validated_date:
                    type: string
                  compliant:
                    type: boolean
                  status:
                    type: string
                  type:
                    type: string
                example:
                  mission_id: 54ab03c6546847ee0d30084a
                  title: Rockets mission 1
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
                  campaign_id: 54ab03c6546847ee0d30088a
                  user_id: 54ab03c6546847ee0d30089a
                  creator_id: 54ab03c6546847ee0d30089a
                  store_id: 54ab03c6546847ee0d30081a
                  score:
                    title: my score
                    value: 10
                  extra_scores:
                    score1:
                      title: my score2
                      value: 8
                  republish_count: '2'
                  reason_noncompliant: missing photo
                  finished_date: '2018-05-29T04:51:40.862Z'
                  validated_date: '2018-05-30T04:51:40.862Z'
                  compliant: true
                  status: archived
                  type: mission
              examples:
                response:
                  value:
                    mission_id: 54ab03c6546847ee0d30084a
                    title: Rockets mission 1
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
                    campaign_id: 54ab03c6546847ee0d30088a
                    user_id: 54ab03c6546847ee0d30089a
                    creator_id: 54ab03c6546847ee0d30089a
                    store_id: 54ab03c6546847ee0d30081a
                    score:
                      title: my score
                      value: 10
                    extra_scores:
                      score1:
                        title: my score2
                        value: 8
                    republish_count: '2'
                    reason_noncompliant: missing photo
                    finished_date: '2018-05-29T04:51:40.862Z'
                    validated_date: '2018-05-30T04:51:40.862Z'
                    compliant: true
                    status: archived
                    type: mission
      summary: Archive
      operationId: Archive
      description: 'Archive a mission.


        The status of the mission will be set to `archived`.'
      tags:
      - Missions
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
