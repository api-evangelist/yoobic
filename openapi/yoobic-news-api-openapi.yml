openapi: 3.2.0
info:
  title: YOOBIC Public News API
  version: ''
  description: Welcome to the **YOOBIC Public API** documentation.
servers:
- url: https://<base_url>/
tags:
- name: News
  description: 'Contains information coming from the news feed tab


    ### Fields


    | Field | Type | Required | Readonly | OrderBy | Description |

    |----------------------|:--------------:|:--------:|:--------:|:-------:|---------------------------|

    |`news_id` | string | | x | | Unique id of the news |

    |`user_id` | string | x | | x | Unique id of a user who published the news |

    |`title` | string | | | | The title of news |

    |`description` | string | x | | | The html content of the news feed |

    |`group_ids` | array |…'
paths:
  /public/api/news/{id}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  news_id:
                    type: string
                  updated_date:
                    type: string
                  created_date:
                    type: string
                  user_id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  views:
                    type: number
                  likes:
                    type: number
                  authorised_viewers:
                    type: number
                  images:
                    type: array
                    items:
                      type: string
                  group_ids:
                    type: array
                    items:
                      type: string
                example:
                  news_id: 54ab03c6546847ee0d30083e
                  updated_date: '2018-05-23T04:51:40.862Z'
                  created_date: '2018-05-23T04:51:40.862Z'
                  user_id: 54ab03c6546847ee0d30072b
                  title: Rocket ltd news
                  description: Contents of the feed.
                  views: 3
                  likes: 10
                  authorised_viewers: 100
                  images:
                  - www.rocketltd.com/file/RocketsFile1.jpg
                  group_ids:
                  - rockets_hq
                  - rockets_pr
                  - rockets_employees
              examples:
                response:
                  value:
                    news_id: 54ab03c6546847ee0d30083e
                    updated_date: '2018-05-23T04:51:40.862Z'
                    created_date: '2018-05-23T04:51:40.862Z'
                    user_id: 54ab03c6546847ee0d30072b
                    title: Rocket ltd news
                    description: Contents of the feed.
                    views: 3
                    likes: 10
                    authorised_viewers: 100
                    images:
                    - www.rocketltd.com/file/RocketsFile1.jpg
                    group_ids:
                    - rockets_hq
                    - rockets_pr
                    - rockets_employees
      summary: Get
      operationId: Get
      description: Get news for the given id.
      tags:
      - News
      parameters:
      - name: id
        in: path
        description: The id of the news
        required: true
        example: 54ab03c6546847ee0d30083e
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
    delete:
      responses:
        '204':
          description: No Content
          headers: {}
      summary: Delete
      operationId: Delete
      description: Delete a news object by id.
      tags:
      - News
      parameters:
      - name: id
        in: path
        description: The id of the news
        required: true
        example: 54ab03c6546847ee0d30083e
        schema:
          type: string
      security:
      - oauth2: []
    patch:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  news_id:
                    type: string
                  updated_date:
                    type: string
                  created_date:
                    type: string
                  user_id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  views:
                    type: number
                  likes:
                    type: number
                  authorised_viewers:
                    type: number
                  images:
                    type: array
                    items:
                      type: string
                  group_ids:
                    type: array
                    items:
                      type: string
                example:
                  news_id: 54ab03c6546847ee0d30081a
                  updated_date: '2018-05-23T04:51:40.862Z'
                  created_date: '2018-05-23T04:51:40.862Z'
                  user_id: 54ab03c6546847ee0d30072b
                  title: Rocket ltd incoming news
                  description: Contents of the feed.
                  views: 3
                  likes: 10
                  authorised_viewers: 100
                  images:
                  - www.rocketltd.com/file/RocketsFile1.jpg
                  group_ids:
                  - rockets_hq
                  - rockets_pr
                  - rockets_employees
              examples:
                response:
                  value:
                    news_id: 54ab03c6546847ee0d30081a
                    updated_date: '2018-05-23T04:51:40.862Z'
                    created_date: '2018-05-23T04:51:40.862Z'
                    user_id: 54ab03c6546847ee0d30072b
                    title: Rocket ltd incoming news
                    description: Contents of the feed.
                    views: 3
                    likes: 10
                    authorised_viewers: 100
                    images:
                    - www.rocketltd.com/file/RocketsFile1.jpg
                    group_ids:
                    - rockets_hq
                    - rockets_pr
                    - rockets_employees
      summary: Partial Update
      operationId: Partial Update
      description: Update a subset of properties of a news object
      tags:
      - News
      parameters:
      - name: id
        in: path
        description: The id of the news
        required: true
        example: 54ab03c6546847ee0d30083e
        schema:
          type: string
      - name: id
        in: path
        description: The id of the news
        required: true
        example: 54ab03c6546847ee0d30081a
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/news?filter={filter}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    news_id:
                      type: string
                    updated_date:
                      type: string
                    created_date:
                      type: string
                    user_id:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    views:
                      type: number
                    likes:
                      type: number
                    authorised_viewers:
                      type: number
                    images:
                      type: array
                      items:
                        type: string
                    group_ids:
                      type: array
                      items:
                        type: string
                  required:
                  - news_id
                  - updated_date
                  - created_date
                  - user_id
                  - title
                  - description
                  - views
                  - likes
                  - authorised_viewers
                  - images
                  - group_ids
                example:
                - news_id: 54ab03c6546847ee0d30081a
                  updated_date: '2018-05-23T04:51:40.862Z'
                  created_date: '2018-05-23T04:51:40.862Z'
                  user_id: 54ab03c6546847ee0d30072b
                  title: Rocket ltd news
                  description: Contents of the feed.
                  views: 3
                  likes: 10
                  authorised_viewers: 100
                  images:
                  - www.rocketltd.com/file/RocketsFile1.jpg
                  group_ids:
                  - rockets_hq
                  - rockets_pr
                  - rockets_employees
                - news_id: 54ab03c6546847ee0d30081c
                  updated_date: '2018-05-23T04:51:40.862Z'
                  created_date: '2018-05-23T04:51:40.862Z'
                  user_id: 54ab03c6546847ee0d30072b
                  title: Rocket ltd news 3
                  description: Contents of the feed.
                  views: 1
                  likes: 12
                  authorised_viewers: 100
                  images:
                  - www.rocketltd.com/file/RocketsFile2.jpg
                  group_ids:
                  - rockets_hq
                  - rockets_pr
                  - rockets_employees
              examples:
                response:
                  value:
                  - news_id: 54ab03c6546847ee0d30081a
                    updated_date: '2018-05-23T04:51:40.862Z'
                    created_date: '2018-05-23T04:51:40.862Z'
                    user_id: 54ab03c6546847ee0d30072b
                    title: Rocket ltd news
                    description: Contents of the feed.
                    views: 3
                    likes: 10
                    authorised_viewers: 100
                    images:
                    - www.rocketltd.com/file/RocketsFile1.jpg
                    group_ids:
                    - rockets_hq
                    - rockets_pr
                    - rockets_employees
                  - news_id: 54ab03c6546847ee0d30081c
                    updated_date: '2018-05-23T04:51:40.862Z'
                    created_date: '2018-05-23T04:51:40.862Z'
                    user_id: 54ab03c6546847ee0d30072b
                    title: Rocket ltd news 3
                    description: Contents of the feed.
                    views: 1
                    likes: 12
                    authorised_viewers: 100
                    images:
                    - www.rocketltd.com/file/RocketsFile2.jpg
                    group_ids:
                    - rockets_hq
                    - rockets_pr
                    - rockets_employees
      summary: Get All
      operationId: Get All
      description: Get all the news.
      tags:
      - News
      parameters:
      - name: filter
        in: query
        description: A valid JSON filter object
        required: false
        example: '{}'
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Get_AllBody'
  /public/api/news/count?where={where}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: number
                example:
                  count: 10
              examples:
                response:
                  value:
                    count: 10
      summary: Count
      operationId: Count
      description: Count all the existing entities based on the where filter
      tags:
      - News
      parameters:
      - name: where
        in: query
        description: A valid JSON [Where filter](#section-api-requests-filter-where)
        required: false
        example: '{ "property": "value" }'
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Get_AllBody'
  /public/api/news:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            '*/*':
              schema:
                type: object
                properties:
                  news_id:
                    type: string
                  updated_date:
                    type: string
                  created_date:
                    type: string
                  user_id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  authorised_viewers:
                    type: number
                  images:
                    type: array
                    items:
                      type: string
                  group_ids:
                    type: array
                    items:
                      type: string
                  tags:
                    type: array
                    items:
                      type: string
                example:
                  news_id: 54ab03c6546847ee0d30081a
                  updated_date: '2020-09-14T04:51:40.862Z'
                  created_date: '2020-09-14T04:51:40.862Z'
                  user_id: 54ab03c6546847ee0d30072b
                  title: Rocket ltd exciting news
                  description: News content
                  authorised_viewers: 100
                  images:
                  - www.rocketltd.com/file/RocketsFile1.jpg
                  group_ids:
                  - rockets_hq
                  - rockets_pr
                  - rockets_employees
                  tags:
                  - rockets_stars
                  - rockets_fans
      summary: Create
      operationId: Create
      description: 'You may create a new single or multiple news using this action.

        When creating a single news object the body contains a json object, when creating multiple news objects the body contains an array of objects.

        **Warning: a maximum of 1000 items can be sent in a single request.**'
      tags:
      - News
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                title:
                  type: string
                description:
                  type: string
                authorised_viewers:
                  type: number
                images:
                  type: array
                  items:
                    type: string
                group_ids:
                  type: array
                  items:
                    type: string
                tags:
                  type: array
                  items:
                    type: string
              example:
                user_id: 54ab03c6546847ee0d30072b
                title: Rocket ltd exciting news
                description: News content
                authorised_viewers: 100
                images:
                - www.rocketltd.com/file/RocketsFile1.jpg
                group_ids:
                - rockets_hq
                - rockets_pr
                - rockets_employees
                tags:
                - rockets_stars
                - rockets_fans
      security:
      - oauth2: []
  /public/api/news/export?type={type}&filter={filter}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                  priority:
                    type: number
                  nextRunAt:
                    type: string
                  _id:
                    type: string
                example:
                  name: Export file
                  type: normal
                  priority: 0
                  nextRunAt: '2018-09-11T15:56:05.387Z'
                  _id: 5b97e5954b99568b4b9101af
              examples:
                response:
                  value:
                    name: Export file
                    type: normal
                    priority: 0
                    nextRunAt: '2018-09-11T15:56:05.387Z'
                    _id: 5b97e5954b99568b4b9101af
      summary: Export
      operationId: Export
      description: 'Export all results as a file.

        This action is asynchronous and returns the id of a job. See `jobs` endpoint to query the status of the job. The file will contain the results with all of the fields specified on the resource.'
      tags:
      - News
      parameters:
      - name: type
        in: path
        description: The type of file, either `csv` (default value) or `excel`
        required: true
        example: csv
        schema:
          type: string
      - name: filter
        in: query
        description: A valid JSON filter object (does not accept a `fields` filter)
        required: false
        example: '{}'
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Get_AllBody'
components:
  schemas:
    Default_Header:
      type: object
      required:
      - Authorization
      properties:
        Authorization:
          type: string
          example: Bearer JWT
  requestBodies:
    Get_AllBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              Authorization:
                $ref: '#/components/schemas/Default_Header'
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /
          tokenUrl: /
          scopes: {}
