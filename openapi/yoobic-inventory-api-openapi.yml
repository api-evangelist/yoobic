openapi: 3.2.0
info:
  title: YOOBIC Public Inventory API
  version: ''
  description: Welcome to the **YOOBIC Public API** documentation.
servers:
- url: https://<base_url>/
tags:
- name: Inventory
  description: An Inventory is a custom data structure to manage and use data in a similar way as in a spreadsheet or database directly from the YOOBIC Platform.
paths:
  /public/api/inventories/{id}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  inventory_id:
                    type: string
                  title:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  group_ids:
                    type: array
                    items:
                      type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                example:
                  inventory_id: 5c015012ad45490041a52f64
                  title: Items
                  name: Grade A products
                  description: Listing of our A products
                  group_ids:
                  - testproduct
                  created_date: '2018-11-30T14:58:26.716Z'
                  updated_date: '2019-01-25T13:34:14.819Z'
              examples:
                response:
                  value:
                    inventory_id: 5c015012ad45490041a52f64
                    title: Items
                    name: Grade A products
                    description: Listing of our A products
                    group_ids:
                    - testproduct
                    created_date: '2018-11-30T14:58:26.716Z'
                    updated_date: '2019-01-25T13:34:14.819Z'
      summary: Get
      operationId: Get
      description: Get an inventory for the given id.
      tags:
      - Inventory
      parameters:
      - name: id
        in: path
        description: The id of the inventory
        required: true
        example: 5c015012ad45490041a52f64
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/inventories?filter={filter}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  paging:
                    type: object
                    properties:
                      total:
                        type: number
                      skip:
                        type: number
                      limit:
                        type: number
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        inventory_id:
                          type: string
                        title:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        group_ids:
                          type: array
                          items:
                            type: string
                        created_date:
                          type: string
                        updated_date:
                          type: string
                      required:
                      - inventory_id
                      - title
                      - name
                      - description
                      - group_ids
                      - created_date
                      - updated_date
                example:
                  paging:
                    total: 2
                    skip: 0
                    limit: 1000
                  data:
                  - inventory_id: 5c015012ad45490041a52f64
                    title: Items
                    name: Grade A products
                    description: Listing of our A products
                    group_ids:
                    - testproduct
                    created_date: '2018-11-30T14:58:26.716Z'
                    updated_date: '2019-01-25T13:34:14.819Z'
                  - inventory_id: 5c015012ad45490041a52f65
                    title: Items
                    name: Grade B products
                    description: Listing of our B products
                    group_ids:
                    - testproduct
                    created_date: '2018-11-30T14:58:26.716Z'
                    updated_date: '2019-01-25T13:34:14.819Z'
              examples:
                response:
                  value:
                    paging:
                      total: 2
                      skip: 0
                      limit: 1000
                    data:
                    - inventory_id: 5c015012ad45490041a52f64
                      title: Items
                      name: Grade A products
                      description: Listing of our A products
                      group_ids:
                      - testproduct
                      created_date: '2018-11-30T14:58:26.716Z'
                      updated_date: '2019-01-25T13:34:14.819Z'
                    - inventory_id: 5c015012ad45490041a52f65
                      title: Items
                      name: Grade B products
                      description: Listing of our B products
                      group_ids:
                      - testproduct
                      created_date: '2018-11-30T14:58:26.716Z'
                      updated_date: '2019-01-25T13:34:14.819Z'
      summary: Get All
      operationId: Get All
      description: Get all the inventories.
      tags:
      - Inventory
      parameters:
      - name: filter
        in: query
        description: A valid JSON filter object
        required: false
        example: '{}'
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Get_AllBody'
  /public/api/inventories/count?where={where}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: number
                example:
                  count: 10
              examples:
                response:
                  value:
                    count: 10
      summary: Count
      operationId: Count
      description: Count all the existing entities based on the where filter
      tags:
      - Inventory
      parameters:
      - name: where
        in: query
        description: A valid JSON [Where filter](#section-api-requests-filter-where)
        required: false
        example: '{ "property": "value" }'
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Get_AllBody'
  /public/api/inventories/export?type={type}&filter={filter}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                  priority:
                    type: number
                  nextRunAt:
                    type: string
                  _id:
                    type: string
                example:
                  name: Export file
                  type: normal
                  priority: 0
                  nextRunAt: '2018-09-11T15:56:05.387Z'
                  _id: 5b97e5954b99568b4b9101af
              examples:
                response:
                  value:
                    name: Export file
                    type: normal
                    priority: 0
                    nextRunAt: '2018-09-11T15:56:05.387Z'
                    _id: 5b97e5954b99568b4b9101af
      summary: Export
      operationId: Export
      description: 'Export all results as a file.

        This action is asynchronous and returns the id of a job. See `jobs` endpoint to query the status of the job. The file will contain the results with all of the fields specified on the resource.'
      tags:
      - Inventory
      parameters:
      - name: type
        in: path
        description: The type of file, either `csv` (default value) or `excel`
        required: true
        example: csv
        schema:
          type: string
      - name: filter
        in: query
        description: A valid JSON filter object (does not accept a `fields` filter)
        required: false
        example: '{}'
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Get_AllBody'
components:
  schemas:
    Default_Header:
      type: object
      required:
      - Authorization
      properties:
        Authorization:
          type: string
          example: Bearer JWT
  requestBodies:
    Get_AllBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              Authorization:
                $ref: '#/components/schemas/Default_Header'
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /
          tokenUrl: /
          scopes: {}
