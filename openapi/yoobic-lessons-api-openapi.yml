openapi: 3.2.0
info:
  title: YOOBIC Public Lessons API
  version: ''
  description: Welcome to the **YOOBIC Public API** documentation.
servers:
- url: https://<base_url>/
tags:
- name: Lessons
  description: Lessons are the activities the users perform during their trainings.
paths:
  /public/api/lessons/{id}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  paging:
                    type: object
                    properties:
                      total:
                        type: number
                      skip:
                        type: number
                      limit:
                        type: number
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        lesson_id:
                          type: string
                        title:
                          type: string
                        type:
                          type: string
                        campaign_id:
                          type: string
                        plan_id:
                          type: string
                        course_id:
                          type: string
                        user_id:
                          type: string
                        status:
                          type: string
                        score:
                          type: object
                          properties:
                            total:
                              type: number
                            value:
                              type: number
                        duration:
                          type: number
                        validated:
                          type: boolean
                        tenant:
                          type: string
                        created_date:
                          type: string
                        updated_date:
                          type: string
                        answers:
                          type: array
                          items:
                            type: object
                            properties:
                              question_id:
                                type: string
                              question_type:
                                type: string
                              question:
                                type: string
                              page_number:
                                type: number
                              question_number:
                                type: number
                              answer:
                                type: number
                example:
                  paging:
                    total: 2
                    skip: 0
                    limit: 1000
                  data:
                  - lesson_id: 5c7004c1b31ec3003a56af4e
                    title: Feedback
                    type: lesson
                    campaign_id: 5c582b8f4a35650044aea049
                    plan_id: 5bf2d58ae553190041467eef
                    course_id: 5bf4448528b7420041ba9b62
                    user_id: 5beee3717fc4d50043801a97
                    status: finished
                    score:
                      total: 0
                      value: 0
                    duration: 2.3
                    validated: true
                    tenant: testproductv6_boost
                    created_date: '2019-02-22T14:18:41.667Z'
                    updated_date: '2019-02-22T14:18:41.667Z'
                    answers:
                    - question_id: e886902d-ddef-43c1-8894-c9f5f101fa56
                      question_type: feedback
                      question: Feedback
                      page_number: 1
                      question_number: 1
                      answer: 3
              examples:
                response:
                  value:
                    paging:
                      total: 2
                      skip: 0
                      limit: 1000
                    data:
                    - lesson_id: 5c7004c1b31ec3003a56af4e
                      title: Feedback
                      type: lesson
                      campaign_id: 5c582b8f4a35650044aea049
                      plan_id: 5bf2d58ae553190041467eef
                      course_id: 5bf4448528b7420041ba9b62
                      user_id: 5beee3717fc4d50043801a97
                      status: finished
                      score:
                        total: 0
                        value: 0
                      duration: 2.3
                      validated: true
                      tenant: testproductv6_boost
                      created_date: '2019-02-22T14:18:41.667Z'
                      updated_date: '2019-02-22T14:18:41.667Z'
                      answers:
                      - question_id: e886902d-ddef-43c1-8894-c9f5f101fa56
                        question_type: feedback
                        question: Feedback
                        page_number: 1
                        question_number: 1
                        answer: 3
      summary: Get
      operationId: Get
      description: Get a lesson for the given id.
      tags:
      - Lessons
      parameters:
      - name: id
        in: path
        description: The id of the lesson
        required: true
        example: 5c7004c1b31ec3003a56af4e
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/lessons?filter={filter}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    lesson_id:
                      type: string
                    title:
                      type: string
                    type:
                      type: string
                    campaign_id:
                      type: string
                    plan_id:
                      type: string
                    course_id:
                      type: string
                    user_id:
                      type: string
                    status:
                      type: string
                    score:
                      type: object
                      properties:
                        total:
                          type: number
                        value:
                          type: number
                        isPercentage:
                          type: boolean
                        completed:
                          type: number
                    validated:
                      type: boolean
                    tenant:
                      type: string
                    created_date:
                      type: string
                    updated_date:
                      type: string
                    answers:
                      type: array
                      items:
                        type: object
                        properties:
                          question_id:
                            type: string
                          question_type:
                            type: string
                          question:
                            type: string
                          page_number:
                            type: number
                          question_number:
                            type: number
                          answer:
                            type: array
                            items:
                              type: array
                              items: {}
                        required:
                        - question_id
                        - question_type
                        - question
                        - page_number
                        - question_number
                        - answer
                    points:
                      type: number
                  required:
                  - lesson_id
                  - title
                  - type
                  - campaign_id
                  - plan_id
                  - course_id
                  - user_id
                  - status
                  - score
                  - validated
                  - tenant
                  - created_date
                  - updated_date
                  - answers
                example:
                - lesson_id: 5c7004c1b31ec3003a56af4e
