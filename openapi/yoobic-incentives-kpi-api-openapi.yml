openapi: 3.2.0
info:
  title: YOOBIC Public Incentives Kpi API
  version: ''
  description: Welcome to the **YOOBIC Public API** documentation.
servers:
- url: https://<base_url>/
tags:
- name: Incentives Kpi
  description: Incentives-KPIs are an indicator for users’ progress within an incentive.
paths:
