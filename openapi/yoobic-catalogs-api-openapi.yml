openapi: 3.2.0
info:
  title: YOOBIC Public Catalogs API
  version: ''
  description: Welcome to the **YOOBIC Public API** documentation.
servers:
- url: https://<base_url>/
tags:
- name: Catalogs
  description: Holds a list of catalogs and their relevant data.
paths:
  /public/api/catalogs/{id}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalog_id:
                    type: string
                  title:
                    type: string
                  group_ids:
                    type: array
                    items:
                      type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                example:
                  catalog_id: 54ab03c6546847ee0d30086a
                  title: Rockets catalog
                  group_ids:
                  - staf
                  - managers
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
              examples:
                response:
                  value:
                    catalog_id: 54ab03c6546847ee0d30086a
                    title: Rockets catalog
                    group_ids:
                    - staf
                    - managers
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
      summary: Get
      operationId: Get
      description: Get a catalog for the given id.
      tags:
      - Catalogs
      parameters:
      - name: id
        in: path
        description: The id of the catalog
        required: true
        example: 54ab03c6546847ee0d30086a
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
    delete:
      responses:
        '204':
          description: No Content
          headers: {}
      summary: Delete
      operationId: Delete
      description: Delete a catalog by id.
      tags:
      - Catalogs
      parameters:
      - name: id
        in: path
        description: The id of the catalog
        required: true
        example: 54ab03c6546847ee0d30086a
        schema:
          type: string
      security:
      - oauth2: []
    patch:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalog_id:
                    type: string
                  title:
                    type: string
                  group_ids:
                    type: array
                    items:
                      type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                example:
                  catalog_id: 54ab03c6546847ee0d30086a
                  title: Houston Rockets catalog.
                  group_ids:
                  - staf
                  - managers
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
              examples:
                response:
                  value:
                    catalog_id: 54ab03c6546847ee0d30086a
                    title: Houston Rockets catalog.
                    group_ids:
                    - staf
                    - managers
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
      summary: Partial Update
      operationId: Partial Update
      description: Update a subset of properties of a catalog
      tags:
      - Catalogs
      parameters:
      - name: id
        in: path
        description: The id of the catalog
        required: true
        example: 54ab03c6546847ee0d30086a
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
              example:
                title: Houston Rockets catalog.
      security:
      - oauth2: []
  /public/api/catalogs?filter={filter}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    catalog_id:
                      type: string
                    title:
                      type: string
                    group_ids:
                      type: array
                      items:
                        type: string
                    created_date:
                      type: string
                    updated_date:
                      type: string
                  required:
                  - catalog_id
                  - group_ids
                  - title
                  - created_date
                  - updated_date
                example:
                - catalog_id: 54ab03c6546847ee0d30086a
                  title: Houston Rockets catalog.
                  group_ids:
                  - staf
                  - managers
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
                - catalog_id: 54ab03c6546847ee0d30086b
                  group_ids:
                  - staf
                  title: Rockets catalog 1
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
                - catalog_id: 54ab03c6546847ee0d30086c
                  title: Rockets catalog 2
                  group_ids:
                  - managers
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
              examples:
                response:
                  value:
                  - catalog_id: 54ab03c6546847ee0d30086a
                    title: Houston Rockets catalog.
                    group_ids:
                    - staf
                    - managers
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
                  - catalog_id: 54ab03c6546847ee0d30086b
                    group_ids:
                    - staf
                    title: Rockets catalog 1
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
                  - catalog_id: 54ab03c6546847ee0d30086c
                    title: Rockets catalog 2
                    group_ids:
                    - managers
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
      summary: Get All
      operationId: Get All
      description: Get all the catalogs.
      tags:
      - Catalogs
      parameters:
      - name: filter
        in: query
        description: A valid JSON filter object
        required: false
        example: '{}'
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Get_AllBody'
  /public/api/catalogs/count?where={where}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: number
                example:
                  count: 10
              examples:
                response:
                  value:
                    count: 10
      summary: Count
      operationId: Count
      description: Count all the existing entities based on the where filter
      tags:
      - Catalogs
      parameters:
      - name: where
        in: query
        description: A valid JSON [Where filter](#section-api-requests-filter-where)
        required: false
        example: '{ "property": "value" }'
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Get_AllBody'
  /public/api/catalogs:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    catalog_id:
                      type: string
                    title:
                      type: string
                    group_ids:
                      type: array
                      items:
                        type: string
                    created_date:
                      type: string
                    updated_date:
                      type: string
                  required:
                  - catalog_id
                  - title
                  - group_ids
                  - created_date
                  - updated_date
                example:
                - catalog_id: 552168f5f8d75fe77c520e7f
                  title: Houston Rockets' managers catalog.
                  group_ids:
                  - managers
                  created_date: '2015-04-05T01:55:17.563Z'
                  updated_date: '2015-09-07T11:30:58.643Z'
                - catalog_id: 552168f5f8d75fe77c520e80
                  title: Houston Rockets' staf catalog.
                  group_ids:
                  - staf
                  created_date: '2015-04-05T01:55:17.563Z'
                  updated_date: '2015-09-07T11:40:58.643Z'
              examples:
                response:
                  value:
                  - catalog_id: 552168f5f8d75fe77c520e7f
                    title: Houston Rockets' managers catalog.
                    group_ids:
                    - managers
                    created_date: '2015-04-05T01:55:17.563Z'
                    updated_date: '2015-09-07T11:30:58.643Z'
                  - catalog_id: 552168f5f8d75fe77c520e80
                    title: Houston Rockets' staf catalog.
                    group_ids:
                    - staf
                    created_date: '2015-04-05T01:55:17.563Z'
                    updated_date: '2015-09-07T11:40:58.643Z'
      summary: Create
      operationId: Create
      description: 'You may create a new single catalog or multiple catalogs using this action.

        When creating a single catalog the body contains a json object, when creating multiple catalogs the body contains an array of objects.

        **Warning: a maximum of 1000 items can be sent in a single request.**'
      tags:
      - Catalogs
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                group_ids:
                  type: array
                  items:
                    type: string
              example:
                title: Houston Rockets' new catalog.
                group_ids:
                - staf
                - managers
      security:
      - oauth2: []
  /public/api/catalogs/export?type={type}&filter={filter}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                  priority:
                    type: number
                  nextRunAt:
                    type: string
                  _id:
                    type: string
                example:
                  name: Export file
                  type: normal
                  priority: 0
                  nextRunAt: '2018-09-11T15:56:05.387Z'
                  _id: 5b97e5954b99568b4b9101af
              examples:
                response:
                  value:
                    name: Export file
                    type: normal
                    priority: 0
                    nextRunAt: '2018-09-11T15:56:05.387Z'
                    _id: 5b97e5954b99568b4b9101af
      summary: Export
      operationId: Export
      description: 'Export all results as a file.

        This action is asynchronous and returns the id of a job. See `jobs` endpoint to query the status of the job. The file will contain the results with all of the fields specified on the resource.'
      tags:
      - Catalogs
      parameters:
      - name: type
        in: path
        description: The type of file, either `csv` (default value) or `excel`
        required: true
        example: csv
        schema:
          type: string
      - name: filter
        in: query
        description: A valid JSON filter object (does not accept a `fields` filter)
        required: false
        example: '{}'
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Get_AllBody'
  /public/api/catalogs/import?type={type}:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                  priority:
                    type: number
                  nextRunAt:
                    type: string
                  _id:
                    type: string
                example:
                  name: Import file
                  type: normal
                  priority: 0
                  nextRunAt: '2018-09-11T15:56:05.387Z'
                  _id: 5b97e5954b99568b4b9101af
              examples:
                response:
                  value:
                    name: Import file
                    type: normal
                    priority: 0
                    nextRunAt: '2018-09-11T15:56:05.387Z'
                    _id: 5b97e5954b99568b4b9101af
      summary: Import
      operationId: Import
      description: 'See the Import file section for more information.


        ### Fields


        | Field | Format | Required | Description |

        |--------------------------|---------|:--------:|-----------------|

        |`catalog_id` | string | | Unique id of the catalog |

        |`title` | string | x | The catalog title |

        |`group_ids` | array | x | Group ids that can see this catalog |

        |`created_date` | timestamp | | Creation date |

        |`updated_date` | timestamp | | Last update date |'
      tags:
      - Catalogs
      parameters:
      - name: type
        in: path
        description: The type of file, either `csv` (default value) or `excel`
        required: true
        example: csv
        schema:
          type: string
      - name: Content-Disposition
        in: header
        description: e.g. form-data; name="file"; filename="file.csv"
        required: false
        example: form-data; name="file"; filename="file.csv"
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/ImportBody'
components:
  requestBodies:
    ImportBody:
      content:
        multipart/form-data, boundary=AaB03x:
          schema:
            type: object
            properties:
              Authorization:
                $ref: '#/components/schemas/Default_Header'
    Get_AllBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              Authorization:
                $ref: '#/components/schemas/Default_Header'
  schemas:
    Default_Header:
      type: object
      required:
      - Authorization
      properties:
        Authorization:
          type: string
          example: Bearer JWT
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /
          tokenUrl: /
          scopes: {}
