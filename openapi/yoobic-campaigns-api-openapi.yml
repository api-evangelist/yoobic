openapi: 3.2.0
info:
  title: YOOBIC Public Campaigns API
  version: ''
  description: Welcome to the **YOOBIC Public API** documentation.
servers:
- url: https://<base_url>/
tags:
- name: Campaigns
  description: A campaign is the main structure used to send tasks to frontline teams and collect data about how they execute them.
paths:
  /public/api/campaigns/{id}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id:
                    type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  tags:
                    type: array
                    items:
                      type: string
                  type:
                    type: string
                  page_titles:
                    type: array
                    items:
                      type: string
                  active:
                    type: boolean
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        question_id:
                          type: string
                        question_type:
                          type: string
                        question:
                          type: string
                        page_number:
                          type: number
                        question_number:
                          type: number
                      required:
                      - question_id
                      - question_type
                      - question
                      - page_number
                      - question_number
                example:
                  campaign_id: 54ab03c6546847ee0d30086a
                  created_date: '2018-05-23T04:51:40.862Z'
                  updated_date: '2018-05-23T04:51:40.862Z'
                  title: Rockets campaign 1
                  description: campaign description here
                  tags:
                  - tag1
                  - tag2
                  type: mission
                  page_titles:
                  - Page 1
                  active: true
                  questions:
                  - question_id: e8335f8d-109d-475f-b10b-113ce6876dc7
                    question_type: number
                    question: number of ice-cream flavors
                    page_number: 1
                    question_number: 1
                  - question_id: e8335f8d-109d-475f-b10b-113ce6876dc8
                    question_type: text
                    question: ice-cream flavors
                    page_number: 1
                    question_number: 2
              examples:
                response:
                  value:
                    campaign_id: 54ab03c6546847ee0d30086a
                    created_date: '2018-05-23T04:51:40.862Z'
                    updated_date: '2018-05-23T04:51:40.862Z'
                    title: Rockets campaign 1
                    description: campaign description here
                    tags:
                    - tag1
                    - tag2
                    type: mission
                    page_titles:
                    - Page 1
                    active: true
                    questions:
                    - question_id: e8335f8d-109d-475f-b10b-113ce6876dc7
                      question_type: number
                      question: number of ice-cream flavors
                      page_number: 1
                      question_number: 1
                    - question_id: e8335f8d-109d-475f-b10b-113ce6876dc8
                      question_type: text
                      question: ice-cream flavors
                      page_number: 1
                      question_number: 2
      summary: Get
      operationId: Get
      description: Get a campaign for the given id.
      tags:
      - Campaigns
      parameters:
      - name: id
        in: path
        description: The id of the campaign
        required: true
        example: 54ab03c6546847ee0d30086a
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
    patch:
      responses:
        '200':
          description: OK
          headers: {}
      summary: Partial Update
      operationId: Partial Update
      description: 'Update a subset of properties of a campaign.

        If `questions` are passed, they will *replace* the existing.'
      tags:
      - Campaigns
      parameters:
      - name: id
        in: path
        description: The id of the campaign
        required: true
        example: 54ab03c6546847ee0d30086a
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                questions:
                  type: array
                  items:
                    type: object
                    properties:
                      question_type:
                        type: string
                      question:
                        type: string
                      page_number:
                        type: number
                      question_number:
                        type: number
                      question_attributes:
                        type: object
                        properties:
                          allow_library:
                            type: boolean
                          hide_mobile:
                            type: boolean
                          mandatory:
                            type: boolean
                    required:
                    - question_type
                    - question
                    - page_number
                    - question_number
              example:
                title: <p>campaign title here updated</p>
                description: campaign description here updated
                questions:
                - question_type: number
                  question: number of ice-cream flavors
                  page_number: 1
                  question_number: 1
                - question_type: text
                  question: ice-cream flavors
                  page_number: 1
                  question_number: 2
                - question: Photo 2
                  question_type: photo
                  page_number: 2
                  question_number: 1
                  question_attributes:
                    allow_library: true
                    hide_mobile: false
                    mandatory: false
      security:
      - oauth2: []
    delete:
      responses:
        '204':
          description: No Content
          headers: {}
      summary: Delete
      operationId: Delete
      description: Delete a campaign by id.
      tags:
      - Campaigns
      parameters:
      - name: id
        in: path
        description: The id of the campaign
        required: true
        example: 54ab03c6546847ee0d30086a
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/campaigns:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  type:
                    type: string
                  group_ids:
                    type: array
                    items:
                      type: string
                  page_titles:
                    type: array
                    items:
                      type: string
                  icon_url:
                    type: string
                  background_url:
                    type: string
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        question_id:
                          type: string
                        question_type:
                          type: string
                        question:
                          type: string
                        question_description:
                          type: string
                        page_number:
                          type: number
                        question_number:
                          type: number
                        mandatory:
                          type: boolean
                  created_date:
                    type: string
                  updated_date:
                    type: string
                example:
                  campaign_id: 5dc18578883086880887175e
                  title: <p>campaign title here</p>
                  description: campaign description here
                  type: mission
                  group_ids:
                  - staff
                  page_titles:
                  - My first page title
                  icon_url: https://res.cloudinary.com/www-yoobic-com/image/upload/a_exif/v1569401814/ji2yhtw926naemtsj6xr.png
                  background_url: https://res.cloudinary.com/www-yoobic-com/image/upload/a_exif/v1569401827/seuuqjbry1e4uusi0nta.png
                  questions:
                  - question_id: 32e1e38c-961a-421f-8cb7-ee1eafefbace
                    question_type: text
                    question: Dow do the shelves look today?
                    question_description: <p>Tell us what you see from left to right.</p>
                    page_number: 1
                    question_number: 1
                    mandatory: false
                  created_date: '2019-11-05T14:21:44.361Z'
                  updated_date: '2019-11-05T14:21:44.361Z'
              examples:
                response:
                  value:
                    campaign_id: 5dc18578883086880887175e
                    title: <p>campaign title here</p>
                    description: campaign description here
                    type: mission
                    group_ids:
                    - staff
                    page_titles:
                    - My first page title
                    icon_url: https://res.cloudinary.com/www-yoobic-com/image/upload/a_exif/v1569401814/ji2yhtw926naemtsj6xr.png
                    background_url: https://res.cloudinary.com/www-yoobic-com/image/upload/a_exif/v1569401827/seuuqjbry1e4uusi0nta.png
                    questions:
                    - question_id: 32e1e38c-961a-421f-8cb7-ee1eafefbace
                      question_type: text
                      question: Dow do the shelves look today?
                      question_description: <p>Tell us what you see from left to right.</p>
                      page_number: 1
                      question_number: 1
                      mandatory: false
                    created_date: '2019-11-05T14:21:44.361Z'
                    updated_date: '2019-11-05T14:21:44.361Z'
      summary: Create
      operationId: Create
      description: 'Create a campaign.


        `icon_url` and `background_url` can be a file''s `_downloadURL` or a created photo''s `url`. Both have to begin with https://.'
      tags:
      - Campaigns
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                type:
                  type: string
                group_ids:
                  type: array
                  items:
                    type: string
                icon_url:
                  type: string
                background_url:
                  type: string
                page_titles:
                  type: array
                  items:
                    type: string
                questions:
                  type: array
                  items:
                    type: object
                    properties:
                      question_type:
                        type: string
                      question:
                        type: string
                      question_description:
                        type: string
                      page_number:
                        type: number
                      question_number:
                        type: number
              example:
                title: <p>campaign title here</p>
                description: campaign description here
                type: mission
                group_ids:
                - staff
                icon_url: https://res.cloudinary.com/www-yoobic-com/image/upload/a_exif/v1569401814/ji2yhtw926naemtsj6xr.png
                background_url: https://res.cloudinary.com/www-yoobic-com/image/upload/a_exif/v1569401827/seuuqjbry1e4uusi0nta.png
                page_titles:
                - My first page title
                questions:
                - question_type: text
                  question: Dow do the shelves look today?
                  question_description: <p>Tell us what you see from left to right.</p>
                  page_number: 1
                  question_number: 1
      security:
      - oauth2: []
  /public/api/campaigns/{id}/publish:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: number
                  mission_ids:
                    type: array
                    items:
                      type: string
                example:
                  count: 6
                  mission_ids:
                  - 5bf166a4e44684a31c7a5f86
                  - 5bf166a4e44684a31c7a5f87
                  - 5bf166a4e44684a31c7a5f88
                  - 5bf166a4e44684a31c7a5f89
                  - 5bf166a4e44684a31c7a5f8a
                  - 5bf166a4e44684a31c7a5f8b
                  - 5bf166a4e44684a31c7a5f8c
              examples:
                response:
                  value:
                    count: 6
                    mission_ids:
                    - 5bf166a4e44684a31c7a5f86
                    - 5bf166a4e44684a31c7a5f87
                    - 5bf166a4e44684a31c7a5f88
                    - 5bf166a4e44684a31c7a5f89
                    - 5bf166a4e44684a31c7a5f8a
                    - 5bf166a4e44684a31c7a5f8b
                    - 5bf166a4e44684a31c7a5f8c
      summary: Publish
      operationId: Publish
      description: Publish missions of a campaign to automatically create one mission per targeted site or per targeted user.
      tags:
      - Campaigns
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                store_client_ids:
                  type: array
                  items:
                    type: string
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      question_id:
                        type: string
                      question_type:
                        type: string
                      question:
                        type: string
                      page_number:
                        type: number
                      answer:
                        items:
                          type: string
                        oneOf:
                        - type: array
                          items: {}
                        - type: number
                    required:
                    - question_type
                    - question
                    - page_number
                    - answer
              example:
                store_client_ids:
                - client_100
                - client_101
                - client_102
                answers:
                - question_id: 8d6d072d-4dcc-42e5-9243-be149b5ef9bb
                  question_type: selectmulti
                  question: Multiple choice
                  page_number: 1
                  answer:
                  - '2'
                - question_type: number
                  question: Number
                  page_number: 3
                  answer: 9
      security:
      - oauth2: []
  /public/api/campaigns/{id}/export?type={type}&filter={filter}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                  priority:
                    type: number
                  nextRunAt:
                    type: string
                  _id:
                    type: string
                example:
                  name: Export file
                  type: normal
                  priority: 0
                  nextRunAt: '2018-09-11T15:56:05.387Z'
                  _id: 5b97e5954b99568b4b9101af
              examples:
                response:
                  value:
                    name: Export file
                    type: normal
                    priority: 0
                    nextRunAt: '2018-09-11T15:56:05.387Z'
                    _id: 5b97e5954b99568b4b9101af
      summary: Export data for a Campaign
      operationId: Export data for a Campaign
      description: 'Exports the data from the missions that have been published for this campaign.


        #### Exported Fields


        The result file contains generic `mission fields` as well as specific columns for each of the questions defined on the campaign. The name of the field for each question is the `question_id`.

        Click here to download an excel file example.

        **Important:**

        The result file contains 2 header rows. The second header row contains additional data from the corresponding question with the format `||`. All other fields in this extra header row are blank. Because of the extra header row, files exported by this endpoint contain data starting on the third line rather than the second.'
      tags:
      - Campaigns
      parameters:
      - name: type
        in: path
        description: The type of file, either `csv` (default value) or `excel`
        required: true
        example: csv
        schema:
          type: string
      - name: filter
        in: query
        description: A valid JSON filter object
        required: false
        example: '{}'
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
  /public/api/campaigns/{id}/import?type={type}:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                  priority:
                    type: number
                  nextRunAt:
                    type: string
                  _id:
                    type: string
                example:
                  name: Import file
                  type: normal
                  priority: 0
                  nextRunAt: '2018-09-11T15:56:05.387Z'
                  _id: 5b97e5954b99568b4b9101af
              examples:
                response:
                  value:
                    name: Import file
                    type: normal
                    priority: 0
                    nextRunAt: '2018-09-11T15:56:05.387Z'
                    _id: 5b97e5954b99568b4b9101af
      summary: Import (update) data for a Campaign
      operationId: Import (update) data for a Campaign
      description: 'Imports the data to update missions that have been published for this campaign.


        See the Import file section for more information.


        The headers and fields imported are the same as those of the campaign data export files. A typical scenario would be to start exporting data for a specific mission, alter the result file, and then import it back.


        **Important:**


        - The second header row with the question alignment data must be present, but is not read. All mission fields (except readonly ones, for more details see missions) can be modified via the campaign data import.


        - Rows without an existing `mission_id` field will **not** be processed. Only existing missions may be updated by this import endpoint.


        - Fields which contain an object as value cannot be updated. This includes fields with type: catalog, user, store, table


        ### Fields


        | Field | Format | Required | Readonly | Description |

        |--------------------------------|--------------|:--------:|:--------:|-----------------|

        |`mission_id` | string | x | x | Unique id of the mission |

        |`title` | string | | | The title of the mission |

        |`type` | string | | x | Mission type |

        |`campaign_id` | string | | x | Unique id of the mission''s parent campaign |

        |`user_id` | string | | x | Unique id of the user who performs the mission |

        |`creator_id` | string | | x | Unique id of the mission creator |

        |`store_id` | string | | x | Unique id of associated store |

        |`status` | string | | x | Current status of the mission if set: `"scheduled"`, `"booked"`, `"finished"`, `"archived"` |

        |`valid_from` | timestamp | | x | Mission available from |

        |`republish_count` | number | | x | The number of times the mission was republished |

        |`booked_date` | timestamp | | x | The date on which the mission was booked to a user |

        |`due_date` | timestamp | | x | The date by which the mission must be completed |

        |`finished_date` | timestamp | | x | The date on which the mission was finished |

        |`score` | number | | | The mission''s main score as its numeric value (e.g. `10`). In file exports/imports this column holds the score value only; the full `{"title", "value"}` object is used in the JSON API representation. |

        |`extra_scores` | number | | x | Export only. Each sub-score is written to its own column, named after the (translated) sub-score title and holding that sub-score''s numeric value. It cannot be set via import. |

        |`compliant` | boolean | | x | The compliance of the mission as marked by an area manager: `true` if marked compliant, `false` if marked noncompliant. If nothing is specified and if the mission is finished, `status` will be "to validate" |

        |`compliant_by_default` | boolean | | x | If `true` the mission is automatically marked compliant on finish |

        |`validated_date` | timestamp | | x | The date on which the mission was validated |

        |`reason_noncompliant` | string | | x | The reason provided by the area manager to explain why the mission was marked noncompliant |

        |`republished_with_answers` | boolean | | x | Has the mission been repulished with the previous answers after being marked noncompliant |

        |`original_mission_id` | string | | x | If present, the `mission_id` of the mission that this mission was republished from |

        |`original_reason_noncompliant` | string | | x | The `reason_noncompliant` from the original mission that was republished. |

        |`action_plan_progress` | number | | x | Completion rate of an action plan. |

        |`task_number` | number | | x | Auto generated when a new mission is created. The value is unique within a campaign. |

        |`created_date` | timestamp | | x | Mission''s creation date |

        |`updated_date` | timestamp | | x | Mission''s last update date |'
      tags:
      - Campaigns
      parameters:
      - name: type
        in: path
        description: The type of file, either `csv` (default value) or `excel`
        required: true
        example: csv
        schema:
          type: string
      - name: Content-Disposition
        in: header
        description: e.g. form-data; name="file"; filename="file.csv"
        required: false
        example: form-data; name="file"; filename="file.csv"
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/ImportBody'
  /public/api/campaigns/{id}/questions:
    post:
      responses:
        '200':
          description: OK
          headers: {}
      summary: Create Question
      operationId: Create Question
      description: 'Create a single question.


        * Restricted to campaigns of type `mission`.


        * If there''s a conflict in the `question_number` the request takes priority. If you add a question in position 1 in page 1 and there is already a question 1 in the page 1, the new question will be placed in position 1 and the one that already existed is moved to position 2 in page 1.


        * The `page_number` and `question_number` are adjusted to the current state. If i.e. the `page_number` does not exist, a new subsequent number will be given regardless of the input.'
      tags:
      - Campaigns
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                question_type:
                  type: string
                page_number:
                  type: number
                question_number:
                  type: number
                question_attributes:
                  type: object
                  properties:
                    allow_library:
                      type: boolean
                    hide_mobile:
                      type: boolean
                    mandatory:
                      type: boolean
              example:
                question: Photo 2
                question_type: photo
                page_number: 200
                question_number: 12
                question_attributes:
                  allow_library: true
                  hide_mobile: false
                  mandatory: false
      security:
      - oauth2: []
  /public/api/campaigns/{id}/questions/{question_id}:
    put:
      responses:
        '200':
          description: OK
          headers: {}
      summary: Update Question
      operationId: Update Question
      description: 'Replace a single question.


        * Restricted to campaigns of type `mission`.


        * If there''s a conflict in the `question_number` the request takes priority. If you add a question in position 1 in page 1 and there is already a question 1 in the page 1, the new question will be placed in position 1 and the one that already existed is moved to position 2 in page 1


        * The `page_number` and `question_number` are adjusted to the current state. If i.e. the `page_number` does not exist, a new subsequent number will be given regardless of the input.'
      tags:
      - Campaigns
      parameters:
      - name: question_id
        in: path
        description: The id of the question
        required: true
        example: e8345f6d-108d-445f-b90b-123ce6876bc9
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                question_type:
                  type: string
                page_number:
                  type: number
                question_number:
                  type: number
                question_attributes:
                  type: object
                  properties:
                    allow_library:
                      type: boolean
                    hide_mobile:
                      type: boolean
                    mandatory:
                      type: boolean
              example:
                question: Photo 2
                question_type: photo
                page_number: 1
                question_number: 2
                question_attributes:
                  allow_library: true
                  hide_mobile: false
                  mandatory: false
      security:
      - oauth2: []
    delete:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id:
                    type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  tags:
                    type: array
                    items:
                      type: string
                  type:
                    type: string
                  page_titles:
                    type: array
                    items:
                      type: string
                  icon_url:
                    type: string
                  background_url:
                    type: string
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        question_id:
                          type: string
                        question_type:
                          type: string
                        question:
                          type: string
                        page_number:
                          type: number
                        question_number:
                          type: number
                      required:
                      - question_id
                      - question_type
                      - question
                      - page_number
                      - question_number
                example:
                  campaign_id: 54ab03c6546847ee0d30086a
                  created_date: '2021-05-23T04:45:02.020Z'
                  updated_date: '2021-05-23T04:51:40.862Z'
                  title: Rockets campaign 1
                  description: campaign description here
                  tags:
                  - tag1
                  - tag2
                  type: mission
                  page_titles:
