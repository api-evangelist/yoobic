      summary: Import audience
      operationId: Import audience
      description: 'Import a simple list of `client_ids` or `titles` of your sites to use it as the audience of an existing campaign.


        ### Fields


        | Field | Format | Required | Description |

        |------------|---------|:--------:|-----------------|

        |`client_id` | string | x | client_id of the store to be added to the audience |

        |`title` | string | x | title of the store to be added to the audience |


        **Important:**

        Either `client_id` or `title` is required. We recommend to import client_ids as they are unique.

        If multiple stores have the same title in your database they will all be added to the audience if you are importing a list of titles.'
      tags:
      - Campaigns
      parameters:
      - name: id
        in: path
        description: The id of the campaign
        required: true
        example: 61c1af9dc9ee430037e6b622
        schema:
          type: string
      - name: Content-Disposition
        in: header
        description: e.g. form-data; name="file"; filename="file.csv"
        required: false
        example: form-data; name="file"; filename="file.csv"
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/ImportBody'
