info:
  title: YOOBIC Public Users API
  version: ''
  description: Welcome to the **YOOBIC Public API** documentation.
servers:
- url: https://<base_url>/
tags:
- name: Users
  description: Expose users for your company.
paths:
  /public/api/users/me:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  username:
                    type: string
                  email:
                    type: string
                  groups:
                    type: array
                    items:
                      type: string
                  created_date:
                    type: string
                  updated_date:
                    type: string
                  tenant:
                    type: string
                example:
                  user_id: 53fb03c6546847fe0d30186b
                  username: mycompany+yoobicserviceaccount@mycompany.com
                  email: support+mycompany+yoobicserviceaccount@yoobic.com
                  groups:
                  - mycompany_group
                  created_date: '2019-02-10T17:20:11.531Z'
                  updated_date: '2020-11-10T12:11:15.439Z'
                  tenant: mycompany
              examples:
                response:
                  value:
                    user_id: 53fb03c6546847fe0d30186b
                    username: mycompany+yoobicserviceaccount@mycompany.com
                    email: support+mycompany+yoobicserviceaccount@yoobic.com
                    groups:
                    - mycompany_group
                    created_date: '2019-02-10T17:20:11.531Z'
                    updated_date: '2020-11-10T12:11:15.439Z'
                    tenant: mycompany
      summary: Get
      operationId: Get
      description: 'Get the serivce account user for the current token.


        **Important:**

        The `tenant` property returned by this endpoint contains the string value of the company name that should be used as the prefix for new Groups.'
      tags:
      - Users
      parameters:
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      security:
      - oauth2: []
