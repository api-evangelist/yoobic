  /public/api/users/{id}/password-change:
    patch:
      responses:
        '200':
          description: OK
          headers: {}
      summary: Change Password
      operationId: Change Password
      description: 'Update user''s `password`.

        Note - `dontSendMail` / boolean / not required / if `true` no email is sent to the user. If `false` or not specified, an email is sent to the user to inform them about the change.'
      tags:
      - Users
      parameters:
      - name: id
        in: path
        description: The id of the user
        required: true
        example: 54ab03c6546847ee0d30086a
        schema:
          type: string
      - name: Accept
        in: header
        description: e.g. application/json
        required: false
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                dontSendMail:
                  type: boolean
              example:
                password: <the-new-password>
                dontSendMail: true
      security:
      - oauth2: []
