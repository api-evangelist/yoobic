- aid: yoobic:yoobic-products-api
  name: Yoobic Products API
  description: "<a id=\"group-products\"></a>\nProducts represent usually physical products and are organised\
    \ by [`catalog`](#group-catalogs)\n\n### Fields\n\n| Field                | Type           | Required\
    \ | Readonly | OrderBy | Description               |\n|----------------------|:--------------:|:--------:|:--------:|:-------:|---------------------------|\n\
    |`product_id`          |  string        |          |    x     |         | Unique id of the product\
    \  |\n|`title`               |  string        |    x     |          |         | The product title\
    \         |\n|`price`               |  number        |          |          |         | The product\
    \ price         |\n|`reference`           |  string        |    x     |          |         | The product\
    \ reference (SKU) |\n|`image`               |  string        |          |          |         | The\
    \ url to the image        |\n|`short_desc`          |  string        |          |          |     \
    \    | Short description of the product         |\n|`description`         |  string        |     \
    \     |          |         | Description of the product |\n|`catalog_id`          |  string      \
    \  |    x     |          |    x    | Unique id of the catalog  |\n|`catalog_title`       |  string\
    \        |    x     |          |         | Title of the catalog  |\n|`tags`                |  array\
    \         |          |          |         | Tags assigned to the product |\n|`manufacturer`      \
    \  |  string        |          |          |         | The manufacturer name of the product |\n|`brand`\
    \               |  string        |          |          |         | The brand name of the product |\
    \  \n|`category`            |  string        |          |          |         | The category name of\
    \ the product |  \n|`images`              |  array         |          |          |         | The images\
    \ associated with this product | \n|`out_of_stock`        |  boolean       |          |          |\
    \         | Whether or not product is available | \n|`created_date`        |  date          |    \
    \      |    x     |         | Creation date             |\n|`updated_date`        |  date        \
    \  |          |    x     |    x    | Last update date          |\n|`custom_fields`       |  object\
    \        |          |          |         | Dynamic properties (optional)|\n\nOne of either fields\
    \ is required:\n\n- catalog_id\n\n- catalog_title\n\n**Important:**\n\n- The `image` property should\
    \ be a secured public URL (HTTPS).\n\n- For best experience in the app, its recommended that the `image`\
    \ be a square picture.\n\n- `custom_fields` contains new attributes that can be used to describe more\
    \ precisely a product.    \nCustom fields provide a new way to customize your product data by allowing\
    \ you to filter and select the relevant data in the application.    \nYou can create your own custom\
    \ fields in the YOOBIC Web Application in order to enrich your product data.    \nFor the full list\
    \ of supported field types see [campaigns](#group-campaigns-question-types)\n\n- `reference` is unique\
    \ per catalog. If a product is uploaded with a combination of `catalog_id` or `catalog_title` and\
    \ reference that already exist, then the corresponding product is updated."
