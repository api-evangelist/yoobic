- aid: yoobic:yoobic-stores-api
  name: Yoobic Stores API
  description: "<a id=\"group-stores\"></a>\nStores are a very important part of the application. They\
    \ represent physical locations of stores.\nThey are the entities which receive missions (not the users).\
    \ The users associated to the stores will be able to see their missions and carry them out if they\
    \ have the correct roles.\nBefore you can create or import stores, you need to have created the store\
    \ types. If you don't know how to do that, please refer to the Store Types section which will provide\
    \ you with a detailed explanation on how to create store types.\n\nIn the front end of the application\
    \ we now call them sites, to use a wording that also applies to companies in different industries\
    \ that do not have frontline locations called stores (but perhaps restaurants, pharmacies etc.). But\
    \ in the context of the API, we still call these entities stores.\n\n<img src=\"https://user-images.githubusercontent.com/4806944/41537992-bb5dc5fc-7312-11e8-8059-311f076a30c7.png\"\
    \ >\n\nWhen you use your GPS to get your position on your smartphone, how are you located?\nEvery\
    \ point on the Earth's surface can be defined with a pair of coordinates: latitude and longitude.\n\
    When you are creating new stores, geo location data is required (`latitude` and `longitude`). In these\
    \ fields you have to enter the coordinates pair of the store you are trying to locate.\n\nIn the case\
    \ you don't provide them, the coordinates will be infered automatically from the `address` but it\
    \ may result in a less accurate location than the exact geolocation of the store.\n\n### Fields\n\n\
    | Field                    | Type    | Required | Readonly | OrderBy | Description     |\n|--------------------------|:-------:|:--------:|:--------:|:-------:|-----------------|\n\
    |`store_id`                |  string |          |     x    |         | Unique store id |\n|`title`\
    \                   |  string |    x     |          |         | Name of the store|\n|`address`   \
    \              |  string |    x     |          |         | The full address allows us to locate the\
    \ store on the map. This is used to display the missions available near the user's position|\n|`tags`\
    \                    |  array  |          |          |         | Tags allow to specify additional\
    \ information about the store|\n|`latitude`                |  float  |    x     |          |     \
    \    | Latitude of the store|\n|`longitude`               |  float  |    x     |          |      \
    \   | Longitude of the store|\n|`client_id`               |  string |    x     |          |    x \
    \   | The external unique id of the store as it may exists in your Information System|\n|`store_type_name`\
    \         |  string |    x     |          |         | The name of the store type|\n|`store_type_id`\
    \           |  string |    x     |          |         | The id of the store type|\n|`info`       \
    \             |  string |          |          |         | Additional information regarding the store.\
    \ Supports HTML layout |\n|`country`                 |  string |          |    x     |         | Country\
    \ location of the store |\n|`notification_emails`     |  array  |          |          |         |\
    \ List of email(s) that will be notified when a mission is finished and/or a request is created/finished\
    \ |\n|`contact_email`           |  string |          |          |         | Contact's email of the\
    \ store i.e. store manager's email |\n|`contact_phone`           |  string |          |          |\
    \         | Contact's phone of the store i.e. store manager's phone |\n|`contact_name`           \
    \ |  string |          |          |         | Contact's name of the store i.e. store manager's name\
    \ |\n|`properties`              |  json   |          |          |         | Extra information that\
    \ enables you to customize the display of the data shown on the Store Activity page. This can be split\
    \ into 4 components: `columns`, `rows`, `grid`, `html` |\n|`photo`                   |  string | \
    \         |          |         | A photo of the store                                            |\n\
    |`vip`                     | boolean |          |          |         | Indicates if the store is a\
    \ VIP store (a flagship store) |\n|`timezone`                | string  |          |    x     |   \
    \      | The Time Zone allows to display the hourly sales data in the store insights in the local\
    \ time of the store. |\n|`capacity`                | number  |          |          |         | Maximum\
    \ number of customers which can be served at the same time |\n|`created_date`            |  date \
    \  |          |    x     |         | Created Date|\n|`updated_date`            |  date   |       \
    \   |    x     |    x    | Updated Date|\n|`custom_fields`           | object  |          |      \
    \    |         | Dynamic properties (optional)|\n\nOne of either fields is required:\n\n- address\n\
    \n- geoloc (latitude + longitude)\n\nIn case one of the fields' missing the other one will be inferred\
    \ automatically by using Google Map API.    \nPlease note that the results may be incorrect and it's\
    \ always recommended to supply both fields.    \n`country` field will be resolved using either the\
    \ geoloc or address. Order of precedence is to resolve by the geoloc and if not present, by address.\n\
    \nOne of either fields is required:\n\n- store_type_name\n\n- store_type_id\n\nThe `properties` field\
    \ is a json array and can be used to display the following columns, rows, grid,  and html.\nIn its\
    \ most generic format it looks like :\n\n```json\n\n[\n    {\n        \"title\": \"string\",\n   \
    \     \"type\": \"string\",\n        \"headers\": [\n            \"string\"\n        ],\n        \"\
    values\": [\n            \"object\"\n        ]\n    }\n]\n```\n\n#### columns\n\n```\n{\n    \"title\"\
    \ : \"KPI S27\",\n    \"type\" : \"columns\",\n    \"values\" : [ \n        {\n            \"title\"\
    \ : \"Revenues\",\n            \"value\" : \"1 456 $\",\n            \"isPercent\" : false,\n    \
    \        \"colorHex\" : \"#00FF00\"\n        }, \n        {\n            \"title\" : \"Nb Hours\"\
    ,\n            \"value\" : \"7/66\",\n            \"colorHex\" : \"#B404FF\"\n        }, \n      \
    \  {\n            \"title\" : \"QP\",\n            \"value\" : 2.8,\n            \"isPercent\" : true,\n\
    \            \"colorHex\" : \"#B40404\"\n        }\n    ]\n}\n```\n\n<img src=\"https://user-images.githubusercontent.com/4806944/67024261-c942a380-f10c-11e9-9a42-07c7415ea421.png\"\
    \ >\n\n#### rows\n\n```\n{\n    \"title\" : \"S26 to S27\",\n    \"type\" : \"rows\",\n    \"values\"\
    \ : [ \n        {\n            \"title\" : \"Revenues\",\n            \"value\" : \"14 647 $\",\n\
    \            \"delta\" : \"+82.5 %\",\n            \"colorHex\" : \"#B40404\"\n        }, \n     \
    \   {\n            \"title\" : \"Clients\",\n            \"value\" : \"1 753\",\n            \"delta\"\
    \ : \"-10.3 %\",\n            \"colorHex\" : \"#B40404\"\n        }, \n        {\n            \"title\"\
    \ : \"Basket\",\n            \"value\" : \"8.4 $\",\n            \"delta\" : \"+4.7 %\",\n       \
    \     \"colorHex\" : \"#04B404\"\n        }\n    ]\n}\n```\n\n<img src=\"https://user-images.githubusercontent.com/4806944/67024307-dd86a080-f10c-11e9-82a4-e4e407282fdd.png\"\
    \ >\n\n#### grid\n\n```\n{\n    \"title\" : \"Hours\",\n    \"type\" : \"grid\",\n    \"headers\"\
    \ : [ \n        \"Day\", \n        \"Morning\", \n        \"Afternoon\", \n        \"Nb Hours\"\n\
    \    ],\n    \"values\" : [ \n        {\n            \"values\" : [ \n                \"Monday\",\
    \ \n                \"9:00\", \n                \"20:00\", \n                \"5/11\"\n          \
    \  ],\n            \"colorHex\" : \"#000000\"\n        }, \n        {\n            \"values\" : [\
    \ \n                \"Tuesday\", \n                \"9:00\", \n                \"20:00\", \n     \
    \           \"2/11\"\n            ],\n            \"colorHex\" : \"#000000\"\n        }, \n      \
    \  {\n            \"values\" : [ \n                \"Wednesday\", \n                \"9:00\", \n \
    \               \"20:00\", \n                \"0/11\"\n            ],\n            \"colorHex\" :\
    \ \"#000000\"\n        }, \n        {\n            \"values\" : [ \n                \"Thursday\",\
    \ \n                \"9:00\", \n                \"20:00\", \n                \"0/11\"\n          \
    \  ],\n            \"colorHex\" : \"#000000\"\n        }, \n        {\n            \"values\" : [\
    \ \n                \"Friday\", \n                \"9:00\", \n                \"20:00\", \n      \
    \          \"0/11\"\n            ],\n            \"colorHex\" : \"#000000\"\n        }, \n       \
    \ {\n            \"values\" : [ \n                \"Saturday\", \n                \"9:00\", \n   \
    \             \"20:00\", \n                \"0/11\"\n            ],\n            \"colorHex\" : \"\
    #A0A0A0\"\n        }, \n        {\n            \"values\" : [ \n                \"Sunday\", \n   \
    \             \" \", \n                \" \", \n                \"0/0\"\n            ],\n        \
    \    \"colorHex\" : \"#A0A0A0\"\n        }\n    ]\n}\n```\n\n#### html\n\n```\n{\n    \"title\" :\
    \ \"Reference docs\",\n    \"type\" : \"html\",\n    \"value\" : \"<center>Your engagement: <br><b>85%</b><br><br>Share\
    \ of shelf :<br><img src=\\\"https://res.cloudinary.com/www-yoobic-com/image/upload/a_exif/w_50/v1516113345/upyw8n7f9fz3v6zhfq29.png\\\
    \"><br><font color=#69D0C0><a href=\\\"mailto:support@yoobic.com?Subject=Reference\\\" target=\\\"\
    _top \\\">Contact us</a></font></center>\"\n}\n```\n\n<img src=\"https://user-images.githubusercontent.com/31584145/50735233-373c6080-11b4-11e9-832d-ad0ecefb4447.png\"\
    \ >\n\n**Important:**\n\n`custom_fields` contains new attributes that can be used to describe more\
    \ precisely a store.    \nCustom fields provide a new way to customize your store data by allowing\
    \ you to filter and select the relevant data in the application.    \nYou can create your own custom\
    \ fields in the YOOBIC Web Application in order to enrich your store data.    \nFor the full list\
    \ of supported field types see [campaigns](#group-campaigns-question-types)"
