- aid: yoobic:yoobic-store-types-api
  name: Yoobic Store Types API
  description: "<a id=\"group-store_types\"></a> \nStores always belong to specific Store Type.    \n\
    Store Types determine which stores users can potentially see.     \nThey will be linked to one or\
    \ several user groups.     \nStore types are used to have a better view of where the stores are (regions),\
    \ or what type they belong to (business unit).     \nStores types are handy in the application when\
    \ publishing campaigns to multiple stores.    \n<img src=\"https://user-images.githubusercontent.com/4806944/41536837-6372e65e-730f-11e8-9bba-78d46a39ca1c.png\"\
    \ >\n\n### Fields\n\n| Field                       | Type     | Required | Readonly | OrderBy | Description\
    \                 |\n|-----------------------------|:--------:|:--------:|:--------:|:-------:|-----------------------------|\n\
    |`store_type_id`              |  string  |          |    x     |         | Unique id of the store\
    \ type |\n|`name`                       |  string  |    x     |          |    x    | Name of the store\
    \ type      |\n|`group_ids`                  |  array   |    x     |          |         | Group ids\
    \ that can see this store type   |\n|`user_ids`                   |  array   |          |        \
    \  |         | User ids that can see this store type |\n|`created_date`               |  date    |\
    \          |    x     |         | Created Date|\n|`updated_date`               |  date    |      \
    \    |    x     |    x    | Updated Date|\n\n### Tip\n\nTo summarize remember that stores always belong\
    \ to specific store type.     \nFor example, all stores in the UK might belong to the type \"UK Stores\"\
    .    \nStore Types must be created before importing or creating stores."
