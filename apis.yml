aid: yoobic
name: Yoobic
description: >-
  YOOBIC is an AI-powered frontline employee experience and retail operations
  platform that unifies task management, internal communications, and mobile
  microlearning, giving headquarters real-time visibility and frontline teams
  the tools to execute in-store. It serves retail, grocery, fashion and luxury,
  convenience, pharmacy, restaurant/QSR, and fitness brands. The YOOBIC Public
  API is a RESTful JSON API (OpenAPI 3.0, 230 paths / 265 operations across 41
  resource groups) for programmatically managing users, stores, missions,
  campaigns, learning, communities, and webhooks, secured with JWT bearer tokens.
