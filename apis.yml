- aid: yoobic:yoobic-roles-api
  name: Yoobic Roles API
  description: >-
    <a id="group-roles"></a>

    Get the list of Roles available for the users in your organization. The roles are defined by a combination
    of `client_role` and `client_role_extension`


    The `client_role` refers to a YOOBIC specific role name between  ROLEFIELD, ROLEMANAGER, ROLEEDITOR,
    ROLESTOREMANAGER, ROLESTORE, ROLEADMIN, and ROLEVIEWER and has an impact on some default features
    of the platform. It also determines what license level the user is attached to.


    The `client_role_extension` refers to a customer-specific designation of a user role, usually based
    on the job or responsibility of the teams. It is used to differentiate users with the same license
    level but access to different modules of the platform.


    Each combination of client_role and `client_role_extension` is given a unique acl_role_id at creation


    Roles are created during the implementation of the platform and cannot be changed by an administrator
    either via the public API or from the admin interface.


    ### Fields


    | Field                  | Type           | Required | Readonly | OrderBy | Description               |

    |------------------------|:--------------:|:--------:|:--------:|:-------:|---------------------------|

    |`acl_role_id`           |  string        |     x    |     x    |         | Unique id of the role
    object  |

    |`client_role`           |  string        |     x    |     x    |         | User roles: ROLEFIELD
    | ROLEMANAGER | ROLEEDITOR | ROLESTOREMANAGER | ROLESTORE | ROLEADMIN | ROLEVIEWER   |

    |`client_role_extension` |  string        |     x    |     x    |         | Additional role information   |

    |`created_date`          |  date          |          |     x    |         | Creation date             |

    |`updated_date`          |  date          |          |     x    |    x    | Last update date          |
