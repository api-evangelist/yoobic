- aid: yoobic:yoobic-shifts-api
  name: Yoobic Shifts API
  description: >-
    <a id="group-shifts"></a>

    A shift object represents a scheduled period of time in which a specific employee is expected to work
    at a specific store. The object includes information about the start and end times of the shift, as
    well as the store location and the ID of the employee who is scheduled to work during that time


    ### Fields


    | Field      | Type   | Required | Readonly | OrderBy | Description                                                            |

    |------------|--------|:--------:|:--------:|:-------:|------------------------------------------------------------------------|

    | username   | string |    x     |          |         | The unique username of the employee assigned
    to the shift.             |

    | user_id    | string |          |    x     |         | An external identifier for the employee                                |

    | title      | string |    x     |          |         | The title of the shift. (visible in the calendar
    of the user)         |

    | store_id   | string |          |    x     |         | An external identifier for the employee                                |

    | start_date | string |    x     |          |    x    | The start date and time of the shift.                                  |

    | shift_id   | string |          |    x     |         | The unique identifier of the shift.                                   |

    | end_date   | string |    x     |          |    x    | The end date and time of the shift.                                   |

    | description| string |          |          |         | The description of the shift.                                         |

    | client_id  | string |    x     |          |         | The unique client_id of the location where
    the shift takes place.      |

    | _lmt       | string |          |    x     |         | The last modified time of the shift.                                  |

    | _ect       | string |          |    x     |         | The time when the shift was created.                                  |
