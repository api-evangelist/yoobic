- aid: yoobic:yoobic-campaigns-api
  name: Yoobic Campaigns API
  description: "<a id=\"group-campaigns\"></a>\nA campaign is the main structure used to send tasks to\
    \ frontline teams and collect data about how they execute them. It is essentially a configurable form\
    \ with instructions and fields (checklists, buttons, photos, open text, etc.) that users fill in from\
    \ the field. They are used for many operational needs like audits, promotions, checklists, surveys,\
    \ health and safety monitoring, and other day-to-day activities.\n\nThere are 4 different types of\
    \ campaigns available in YOOBIC:\n\n- Quick task\n\n- Memo\n\n- Form\n\n- Workflow\n\nArchived campaigns\
    \ are visible in the [campaigns_archive](#group-campaigns_archive) table.\n\n### Fields\n\n| Field\
    \                | Type        | Required | Readonly   | OrderBy | Description               |\n|----------------------|:-----------:|:--------:|:----------:|:-------:|---------------------------|\n\
    |`campaign_id`         |  string     |    x     |     x      |         | Unique id of the campaign\
    \ |\n|`title`               |  string     |    x     |            |         | The campaign title \
    \       |\n|`description`         |  string     |          |            |         | The campaign description\
    \  |\n|`type`                |  string     |    x     |            |         | The campaign type \
    \ (mission, service, todo, poll, lesson, visit)     |\n|`group_ids`           |  array      |    x\
    \     |            |         | Group ids that can see this campaign |\n|`user_ids`            |  array\
    \      |          |            |         | User ids that can see this campaign |\n|`tags`        \
    \        |  array      |          |            |         | The list of tags          |\n|`scoring`\
    \             |  boolean    |          |            |         | true if scoring is enabled for missions\
    \ from this campaign, false otherwise | \n|`recurring`           |  boolean    |          |      \
    \      |         | true if this campaign is recurring, false if it is a one-off campaign | \n|`active`\
    \              |  boolean    |          |    x       |         | true if campaign is neither paused\
    \ nor archived | \n|`archived`            |  boolean    |          |    x       |         | true if\
    \ campaign is paused | \n|`icon_url`            |  string     |          |            |         |\
    \ `_downloadURL` of a File or a `url` of a Photo. Icon size recommendation is 100px X 100px. |\n|`background_url`\
    \      |  string     |          |            |         | `_downloadURL` of a File or a `url` of a\
    \ Photo. |\n|`page_titles`         |  array      |          |            |         | An ordered list\
    \ of page titles i.e. first title is the first page title etc. |\n|`questions`           |  array\
    \      |          |            |         | The campaign's questions  |\n|`created_date`        | \
    \ date       |          |     x      |         | Creation date             |\n|`updated_date`    \
    \    |  date       |          |     x      |    x    | Last update date          |\n\nThe `questions`\
    \ field is defined as an array of:\n| Field                | Type           | Description        \
    \       |\n|----------------------|----------------|---------------------------|\n|`question_id` \
    \        |  string        | Unique id of the question |\n|`question_type`       |  string        |\
    \ The type of the question. Supported types: `text`, `textarea`, `toggle`, `checkbox`, `information`,\
    \ `todo`, `photo`, `multiphotos`, `selectbuttons`, `select`, `selectmulti`, `address`, `date`, `number`,\
    \ `starrating`, `image`. |\n|`question`            |  string        | The title of the question |\n\
    |`question_description`|  string        | The description of the question |\n|`mandatory`        \
    \   |  boolean       | If `true`, the question has to be answered. Defaults to `false` |\n|`page_number`\
    \         |  number        | The number of the page the question appears in |\n|`question_number`\
    \     |  number        | The number of the question |\n|`hide_mobile`         |  boolean       | Hide\
    \ the question on mobile devices. Defaults to `false`. |\n|`question_attributes` |  object       \
    \ | Question attributes for specific question types.|\n\nThe `question_attributes` field is defined\
    \ as an object with the following fields:\n| Field                | Type           | Description \
    \              |\n|----------------------|----------------|---------------------------|\n|`max_photos`\
    \          |  number        | Maximum of allowed photos to upload. Applies only to questions of type\
    \ `multiphotos`.         |\n|`values`              |  array         | Values to be displayed as options\
    \ to choose from in the question. Applies only to questions of type `selectbuttons`, `select`, `selectmulti`.\
    \           |\n|`min`                 |  number        | If present, value must be above or including\
    \ it. Applies only to questions of type `number`. |\n|`max`                 |  number        | If\
    \ present, value must be below or including it. Applies only to questions of type `number`, `starrating`.\
    \ |\n\n#### Question Types\n\n<a id=\"group-campaigns-question-types\"></a>\n**Important**    \nBelow\
    \ is a list of the supported types and their value types:\n\n| question_type | Type           | Description\
    \ |\n|---------------|:--------------:|-------------|\n| address       |  string        |        \
    \     |\n| date          |  string        |             |\n| information   |  string        |    \
    \         |\n| select        |  string        | Single value chosen from the `values` defined in `question_attributes`\
    \ |\n| textarea      |  string        |             |\n| text          |  string        |        \
    \     |\n| photo         |  URL           | A valid image URL      |\n| multiphotos   |  array of\
    \ URLs | Valid image URLs and up to `max_photos` defined in `question_attributes`     |\n| selectbuttons\
    \ |  array         | Multiple values chosen from the `values` defined in `question_attributes`   \
    \   |\n| selectmulti   |  array         | Multiple values chosen from the `values` defined in `question_attributes`\
    \      |\n| number        |  number        | Might have min, max borders as defined in `question_attributes`\
    \      |\n| starrating    |  number        | Might have max border as defined in `question_attributes`.\
    \ No negatives allowed.      |\n| checkbox      |  boolean       |             |\n| toggle       \
    \ |  boolean       |             |\n| image         |                | This is a readonly property\
    \ (informative) which does not have a value. |\n\n**Important**\n\n- If `page_titles` does not have\
    \ a title for a given page then a default will be given -    \nSo i.e. if the values are -    \n```json\n\
    [ \"first chapter\", \"second chapter\" ]\n``` \nand there are three pages in total, then the title\
    \ for the third page will be `Page 3`.\n\n- To filter on `live` campaigns only you should filter accordingly:\
    \ \n```json\n{ \"active\": true,  \"archived\": { \"neq\": true } }\n```"
  humanURL: https://docs.yoobic.com/api.html
  baseURL: https://api.yoobic.com/public/api
