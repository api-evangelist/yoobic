- aid: yoobic:yoobic-custom-model-instances-datasets-api
  name: Yoobic Custom Model Instances - Datasets API
  description: "<a id=\"group-custom_model_instances\"></a>\nDatasets are where all your data is stored.\
    \ They have some similarities to spreadsheets, for example they look similar and support some of the\
    \ same functions and formulas. But, in terms of power, efficiency, and elasticity, datasets tend to\
    \ behave more like a database. Datasets in Yoobic can used all the different data types available\
    \ in a Yoobic Campaign.\n\nDatasets can be used to:\n\n- Display your data dynamically in Yoobic’s\
    \ missions\n\n- Update dynamically your data based on Yoobic’s missions\n\n- Filter, sort, summarise,\
    \ and link data\n\n- Preserve data integrity\n\n- Trigger automations and run calculation\n\n### Endpoint:\
    \ Inventory\n\nYOOBIC’s dataset collection is stored in the inventory collection therefore we refer\
    \ to the inventory endpoint to create or update a dataset.\n\n### Custom Model definition\n\nA dataset\
    \ is identified in YOOBIC’s public API by a custom_model_id . We refer to datasets as a Custom Model\
    \ because each dataset object is customizable (different field type available for each of the fields).\
    \ Consequently, each row of a dataset (aka Custom_model) is referred to as a custom_model_instances.\n\
    \n### How to create new instances in a dataset\n\nImport a csv/excel file containing in the header\
    \ the name of the field and in the cells the value you want to import. If you are not sure of the\
    \ format of the csv/excel file, we recommend you to first export your dataset to a csv/excel file\
    \ and then to use this file as a template for the import.\n\n### How to update existing instances\
    \ in a dataset\n\nImport a csv/excel file containing in the header the name of the field and in the\
    \ cells the value you want to import. If you wish to update the value, you have to provide in the\
    \ custom_model_instances_id column the value of the instance you wish to update. It’s a unique identifier\
    \ generated by YOOBIC. The easiest way to do it is to export the existing dataset, then to modify\
    \ the value directly in the file and finally to import it into YOOBIC.\n\n### Fields\n\n| Field  \
    \                           | Type           | Required | Readonly | OrderBy | Description       \
    \        |\n|-----------------------------------|:--------------:|:--------:|:--------:|:-------:|---------------------------|\n\
    |`custom_model_instances_id`        |  string        |          |    x     |         | Unique identifier\
    \         |\n\n**Important**    \nThe columns of the export/import depend on the inventory's questions.\
    \    \nEach `question_id` is a column header. See [`inventory`](#group-inventory) for more details."
  humanURL: https://docs.yoobic.com/api.html
  baseURL: https://api.yoobic.com/public/api
  tags:
  - Custom Model Instances - Datasets
