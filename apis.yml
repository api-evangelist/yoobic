- aid: yoobic:yoobic-users-api
  name: Yoobic Users API
  description: "<a id=\"group-users\"></a>\nExpose users for your company.\n\nRemember:\n\n- Users are\
    \ the people at your company with access to the YOOBIC mobile and/or web apps.\n\n- Users can be assigned\
    \ to one or more groups after they are created\n\n- Users can have multiple tags\n\n### Fields\n\n\
    | Field                    | Type    | Required | Readonly | OrderBy | Available for all users | Description\
    \     |\n|--------------------------|:-------:|:--------:|:--------:|:-------:|:-----------------------:|-----------------|\n\
    |`user_id`                 |  string |          |    x     |         |         x               | Unique\
    \ user id |\n|`username`                |  string |    x     |          |    x    |         x    \
    \           | Unique username |\n|`password`                |  string |    x     |          |    \
    \     |         x               | Password, required on creation only |\n|`first_name`           \
    \   |  string |    x     |          |         |         x               | First name|\n|`last_name`\
    \               |  string |    x     |          |         |         x               | Last name|\n\
    |`client_role`             |  string |    x     |          |         |         x               | User\
    \ roles: ROLEFIELD \\| ROLEMANAGER \\| ROLEEDITOR \\| ROLESTOREMANAGER \\| ROLESTORE \\| ROLEADMIN\
    \ \\| ROLEVIEWER|\n|`client_role_extension`   |  string |          |          |         |        \
    \ x               | Indicates an extension of a user role. Has to match an existing role extension\
    \ in the database |\n|`email`                   |  string |          |          |         |      \
    \   x               | Email |\n|`address`                 |  string |          |          |      \
    \   |         x               | User's work address |\n|`groups`                  |  array  |    x\
    \     |          |         |         x               | The list of groups the user is in|\n|`language`\
    \                |  string |          |          |         |         x               | Preferred language\
    \ |\n|`phone`                   |  string |          |          |         |         x            \
    \   | Phone number|\n|`photo`                   |  string |          |          |         |      \
    \   x               | Url of the user's picture |\n|`store_id`                |  string |        \
    \  |    x     |    x    |         x               | Primary Store. Setting up a store_id on a user\
    \ will create a geofilter on this user |\n|`tags`                    |  array  |          |      \
    \    |         |         x               | Tags allow to specify additional information about the\
    \ user|\n|`sso`                     |  boolean|     x    |          |         |         x        \
    \       | Flag if a user will login through a third party |\n|`allow_local_login`       |  boolean|\
    \          |          |         |         x               | Flag if a user will login with password,\
    \ even if set to third party in tenant (company) configuration |\n|`last_seen`               |  date\
    \   |          |    x     |         |         x               | The date on which the user connected\
    \ for the last time.  |\n|`terms_of_acceptance_date`|  date   |          |    x     |         |  \
    \       x               | The date in which terms were last accepted |\n|`mobile_version`        \
    \  |  string |          |    x     |         |         x               | Version of the App used on\
    \ mobile by the user.  |\n|`desktop_version`         |  string |          |    x     |         | \
    \        x               | Version of the App used on desktop by the user. |\n|`created_date`    \
    \        |  date   |          |    x     |         |         x               | Created Date|\n|`updated_date`\
    \            |  date   |          |    x     |    x    |         x               | Updated Date|\n\
    |`custom_fields`           | object  |          |          |         |         x               | Dynamic\
    \ properties (optional)|\n|`weekly_schedule`         | object  |          |          |         | \
    \        x               | Contains data on an employee's working hours for each day of the week.|\n\
    |`client_ids`              | array   |          |          |         |         x               | List\
    \ of stores that the user can have access to, selected with their client_id. Creates or updates the\
    \ corresponding user's geofilter if not empty\n|`store_type_names`        | array   |          | \
    \         |         |         x               | List of stores' store_types that the user can have\
    \ access to, selected with their store_type_name. Creates or updates the corresponding user's geofilter\
    \ if not empty\n| `position`               | string  |          |          |         |           \
    \              | Position                               |\n| `department`             | string  |\
    \          |          |         |                         | Department                           \
    \  |\n| `division`               | string  |          |          |         |                     \
    \    | Division                               |\n| `company`                | string  |          |\
    \          |         |                         | Company                                |\n| `hiring_date`\
    \            | date    |          |          |         |                         | Date when the user\
    \ joined the company  |\n| `skills`                 | array   |          |          |         |  \
    \                       | Skills                                 |\n| `cover`                  | string\
    \  |          |          |         |                         | Cover URL                         \
    \         |\n| `description`            | string  |          |          |         |              \
    \           | Description                            |\n\n**Important:**\n\n- One of either fields\
    \ is required in case of user creation:\n    - password\n    - sso\n\n- `allow_local_login` is required\
    \ only if in tenant (company) configuration it is specified to allow login using a third party, but\
    \ would like to enable specific user a login with a password instead.\n\n- Combination of `client_role`\
    \ and `client_role_extension` defines the user's permission. A wrong combination of these two will\
    \ cause a validation error, specifying an invalid permission. If `client_role_extension` is not passed\
    \ (optional), `client_role` will refer to the corresponding base permission.\n\n- `custom_fields`\
    \ contains new attributes that can be used to describe more precisely a user.    \nCustom fields provide\
    \ a new way to customize your user data by allowing you to filter and select the relevant data in\
    \ the application.    \nYou can create your own custom fields in the YOOBIC Web Application in order\
    \ to enrich your user data.    \nFor the full list of supported field types see [campaigns](#group-campaigns-question-types)\n\
    \n- The `username` of a user has to be unique across live and archived users and is used to log in\
    \ to the platform.\n\n- If a user already has a `store_id` in their profile, the corresponding store’s\
    \ `client_id` will be exported in the next export. It can be used instead of the `store_id`\n\n- It\
    \ is possible to add several `client_ids` and/or `store_type_names` for a single user. When updating\
    \ a user, the list of `client_ids` and `store_type_names` will replace the previous one in the user's\
    \ geofilter.\n\n- It is not possible to filter users on the `client_ids` or `store_type_names` attributes.\
    \ Please use the geofilter collection to find if a geofilter exist for a user on a specific store\
    \ or store_type\n\nDescription of the `weekly_schedule` object:\n\n- This object contains data on\
    \ an employee's working hours for each day of the week.\n\n- Each day of the week is represented by\
    \ a key (e.g. `mon`, `tue`, etc.) and has a corresponding value that contains information about the\
    \ working periods for that day.\n\n### Fields\n\n| Field   | Type    | Required | Readonly | OrderBy\
    \ | Description     |\n|---------|:-------:|:--------:|:--------:|:-------:|-----------------|\n|\
    \ mon     | JSON    | no       | no       | no      | Contains data on the working hours for Monday\
    \ |\n| tue     | JSON    | no       | no       | no      | Contains data on the working hours for\
    \ Tuesday |\n| wed     | JSON    | no       | no       | no      | Contains data on the working hours\
    \ for Wednesday |\n| thu     | JSON    | no       | no       | no      | Contains data on the working\
    \ hours for Thursday |\n| fri     | JSON    | no       | no       | no      | Contains data on the\
    \ working hours for Friday |\n| sat     | JSON    | no       | no       | no      | Contains data\
    \ on the working hours for Saturday |\n| sun     | JSON    | no       | no       | no      | Contains\
    \ data on the working hours for Sunday |\n\nFor each day of the week, the corresponding value is an\
    \ object with the following fields:\n\n| Field   | Type   | Required | Readonly | OrderBy | Description\
    \                                                            |\n|---------|--------|----------|----------|---------|------------------------------------------------------------------------|\n\
    | periods | array  | no       | no       | no      | Contains an array of objects, each of which represents\
    \ a working period for the day. |\n\nEach object in the `periods` array has the following fields:\n\
    \n| Field | Type   | Required | Readonly | OrderBy | Description                                 \
    \                           |\n|-------|--------|----------|----------|---------|------------------------------------------------------------------------|\n\
    | from  | string | no       | no       | no      | The start time of the working period. Format is\
    \ `hh:mm` in UTC.      |\n| to    | string | no       | no       | no      | The end time of the working\
    \ period. Format is `hh:mm` in UTC.        |\n\nIf a day doesn’t have data in the `weekly_schedule`\
    \ object, it is considered that the user is not scheduled to work on that day."
