- aid: yoobic:yoobic-groups-api
  name: Yoobic Groups API
  description: "<a id=\"group-groups\"></a>\nGroups are used to manage users. This is VERY important as\
    \ Groups are what make using the application much simpler. By adding Users to Groups, when you need\
    \ to modify sets of Users, you just change the groups properties and all the Users in the Group inherit\
    \ these properties (much better than changing each individual user manually). Moreover, Groups allow\
    \ to restrict visibility when some entities are shared (Missions, News, Documents, ...)\n\n### How\
    \ do I structure my groups ?\n\nEach Group usually corresponds to a population of Users (ex: Admin,\
    \ HQ, VM Managers, Retail Area Managers, Stores, etc.).\n<img src=\"https://user-images.githubusercontent.com/4806944/41535702-fd95441a-730b-11e8-8fbe-603f8a43f51f.png\"\
    >\n\n### General Group\n\nUsually there is a general group, which has the name of the tenant.\nThis\
    \ group will contain all of the other Groups and will give the Users access to shared information.\n\
    \nThen you will usually find a Group for each type of user. \nThese usually fall into one of these\
    \ categories:\n\n* Admin\n\n* Area Managers\n\n* HQ\n\n* Itinerants\n\n* Store Users\n\n### Fields\n\
    \n| Field                       | Type     | Required | Readonly | OrderBy | Description         \
    \     |\n|-----------------------------|:--------:|:--------:|:--------:|:-------:| -------------------------|\n\
    |`group_id`                   |  string  |          |    x     |         | The group_id corresponds\
    \ to the Group title in lowercase letters, with `_` instead of spaces, and without special characters\
    \ |\n|`title`                      |  string  |     x    |          |         | Group Title |\n|`description`\
    \                |  string  |          |          |         | Group Description |\n|`group_ids`  \
    \                |  array   |          |          |    x    | group ids that belong to this group\
    \                |\n|`user_ids`                   |  array   |          |          |    x    | user\
    \ ids that belong to this group                |\n|`created_date`               |  date    |     \
    \     |    x     |         | Created Date |\n|`updated_date`               |  date    |          |\
    \    x     |    x    | Updated Date |\n|`icon_url`                   |  string  |          |     \
    \     |         | Icon URL |\n\n### Tip\n\nTo summarise, remember that:\n\n* Users are organised in\
    \ groups\n\n* Groups must be created prior to importing any users to the database\n\n* A user can\
    \ belong to multiple groups\n\n* There can be sub-groups\n\n* Users inherit their level or rights\
    \ from the group(s) they belong to\n<img src=\"https://user-images.githubusercontent.com/4806944/41536506-7949d9d4-730e-11e8-81d8-62c0bc39c9e3.png\"\
    >"
