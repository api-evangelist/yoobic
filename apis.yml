    the comment                                    |

    | mission_id           |  string        |    x     |          |         | Id of the mission that was
    interacted with this comment |

    |`text`                |  string        |    x     |          |         | Comment text                                                       |

    |`photo_url`           |  string        |    x     |          |         | Comment photo                                                       |

    |`comment_date`        |  date          |          |          |         | The date of the comment          |

    |`updated_date`        |  date          |          |          |    x    | Last update date          |

    |`created_date`        |  date          |          |          |         | Creation date             |


    **Important**:


    - Either `text` or `photo_url` are required


    - The message can be only a single text or a single photo url. The photo url to be visible in YOOBIC
    should be a valid url to an image (jpg, png, gif, etc...).


    - The mission comment does not support sub comments or reply to comments or reaction to comments.
    It is a simple comment with no reference to the original comment.


    - To handle historical comment you should use the `comment_date` field. In case the `comment_date`
    is not provided, the `updated_date` will be used instead.


    - The text of the comment is limited to 2000 characters.
