- aid: yoobic:yoobic-incentives-kpi-api
  name: Yoobic Incentives Kpi API
  description: >-
    <a id="group-incentives-kpi"></a>

    Incentives-KPIs are an indicator for users’ progress within an incentive. Each incentives-kpi represents
    the sale of one or more items of a single product. When a user submits new progress for an incentive,
    the data is then broken down product by product, creating one or several new kpis. In case there are
    no products involved, submitting new progress will generate a single incentive kpi with an empty product


    ### Fields


    | Field                | Type           | Required | Readonly | OrderBy | Description                                    |

    |----------------------|:--------------:|:--------:|:--------:|:-------:|------------------------------------------------|

    |`incentive_kpi_id`    |  string        |          |    x     |         | Unique id incentive_kpi                        |

    |`incentive_id`        |  string        |    x     |          |         | The incentive_id                               |

    |`owner_id`            |  string        |    x     |          |         | The user who submitted the
    kpi                 |

    |`username`            |  string        |          |    x     |         | The owner username                             |

    |`first_name`          |  string        |          |    x     |         | The owner first name                           |

    |`last_name`           |  string        |          |    x     |         | The owner last name                            |

    |`participant_type`    |  string        |    x     |          |         | Type of incentives-kpi ('individual'
    or 'team')|

    |`start_time`          |  date          |    x     |          |         | The start time of the kpi                      |

    |`end_time`            |  date          |    x     |          |         | The end time of the kpi                        |

    |`participant_user_id` |  string        |          |          |         | The participant user in
    kpi                    |

    |`participant_group_id`|  string        |          |          |         | The participant group in
    kpi                   |

    |`product_id`          |  string        |          |          |         | product_id involved in the
    kpi                 |

    |`price`               |  number        |          |    x     |         | The product's price                            |

    |`count`               |  number        |          |          |         | Number of units in the kpi                     |

    |`weight`              |  number        |          |    x     |         | Weight of product in total
    calculation         |

    |`total`               |  number        |          |          |         | Total value of the kpi                         |

    |`created_date`        |  date          |          |    x     |         | KPI submission date                            |

    |`updated_date`        |  date          |          |    x     |    x    | Last update date                               |


    Only one of these fields is required:


    - participant_user_id


    - participant_group_id


    **Important:**


    - If `participant_type` equals `teams`, `participant_group_id` must be filled with `group_id` value.


    - If `participant_type` equals `individual`, `participant_user_id` must be filled with `user_id` value.


    - `product_id` is optional and appear only if product is part of the related incentive.


    - `price` has a value only if a `product_id` exists.
