- aid: yoobic:yoobic-missions-api
  name: Yoobic Missions API
  description: "<a id=\"group-missions\"></a>\nMissions are the basic campaign type. The store users will\
    \ receive missions with fields to complete, for example send a photo of their display or change the\
    \ location of the new collection in store. The mission creator will define its content from the dashboard,\
    \ then he will publish it to the appropriate stores. Once the users have completed the mission they\
    \ will be able to submit it. The managers responsible for the store will then be able to define the\
    \ mission as compliant (if they deem the answers acceptable) or non compliant (if they believe there\
    \ is room for improvement). If a mission is evaluated as non compliant, the manager can choose for\
    \ the user to retake the mission entirely or he can specify which parts of the mission need improving\
    \ and republish the mission to the store with the rest of the answers already filled in.\n\nTips:\
    \ a mission is an entity of a campaign published on a store.\n\n<img src=\"https://user-images.githubusercontent.com/4806944/46027402-7576ae00-c0f6-11e8-9579-808251a4aa97.png\"\
    \ >\n\nA mission is either available, ongoing or finished.\n<img src=\"https://user-images.githubusercontent.com/4806944/46028408-2e3dec80-c0f9-11e8-92c4-673fc5ef4794.png\"\
    \ >\n\nA finished mission is either \"to validate\", \"compliant\" or \"not compliant\".\n\n- **Available**\
    \ : a mission is available as soon as it has been published on a store, and hasn't been started yet\
    \ by a user.\n\n- **Ongoing**: as soon as a user starts or loads a mission, the status of the mission\
    \ goes from \"available\" to \"ongoing\" (known as `booked` under the status field of a mission)\n\
    \n- **Finished** : once the mission has been submitted, it is finished.\n    - **To validate**: if\
    \ the mission hasn't been validated yet  and marked as \"compliant\" or \"not compliant\", or isn't\
    \ configured to be automatically marked as compliant.\n    - **Compliant** \n    - **Not compliant**\n\
    \n- **Scheduled**: a mission is scheduled as soon as it has been published on a store and if `valid_from`\
    \ date did not reach the current date yet.\n\n- **Archived**: a mission gets status archived as soon\
    \ as it’s archived\n\n### Fields\n\n<a id=\"group-missions-fields\"></a>\n| Field                \
    \          | Type         | Required | Readonly | OrderBy | Description     |\n|--------------------------------|--------------|:--------:|:--------:|:-------:|-----------------|\n\
    |`mission_id`                    |  string      |     x    |     x    |         | Unique id of the\
    \ mission  |\n|`title`                         |  string      |          |          |         | The\
    \ title of the mission  |\n|`type`                          |  string      |          |          |\
    \    x    | Mission type             |\n|`campaign_id`                   |  string      |        \
    \  |     x    |    x    | Unique id of the mission's parent campaign |\n|`user_id`               \
    \        |  string      |          |     x    |    x    | Unique id of the user who performs the mission\
    \   |\n|`creator_id`                    |  string      |          |          |    x    | Unique id\
    \ of the mission creator  |\n|`store_id`                      |  string      |          |     x  \
    \  |    x    | Unique id of associated store  |\n|`status`                        |  string      |\
    \          |     x    |    x    | Current status of the mission if set: `\"scheduled\"`, `\"booked\"\
    `, `\"finished\"`, `\"archived\"`  |\n|`valid_from`                    |  timestamp   |          |\
    \     x    |         | Mission available from   |\n|`republish_count`               |  number    \
    \  |          |          |         | The number of times the mission was republished  |\n|`available_on_book`\
    \             |  boolean     |          |     x    |         | If `true`, a new copy of this mission\
    \ would be created when the mission is started |\n|`available_on_finished`         |  boolean    \
    \ |          |     x    |         | If `true`, a new copy of this mission would be created on finish\
    \ |\n|`booked_date`                   |  timestamp   |          |     x    |         | The date on\
    \ which the mission was booked to a user  |\n|`due_date`                      |  timestamp   |   \
    \       |     x    |         | The date by which the mission must be completed |\n|`duration`    \
    \                  |  number      |          |     x    |         | Time spent on the mission (in\
    \ minutes)      |\n|`finished_date`                 |  timestamp   |          |     x    |    x  \
    \  | The date on which the mission was finished  |\n|`score`                         |  object   \
    \   |          |          |         | The score of the mission as a JSON object `{\"title\": \"my\
    \ score\", \"value\": 10}`  |\n|`extra_scores`                  |  object      |          |      \
    \    |         | The extra scores of the mission as a JSON object `{\"score1\": { \"title\": \"my\
    \ score\", \"value\": 10}}`  |\n|`compliant`                     |  boolean     |          |    x\
    \     |         | The compliance of the mission as marked by an area manager: `true` if marked compliant,\
    \ `false` if marked noncompliant. If nothing is specified and if the mission is finished, `status`\
    \ will be \"to validate\" |\n|`compliant_by_default`          |  boolean     |          |        \
    \  |         | If `true` the mission is automatically marked compliant on finish |\n|`validated_date`\
    \                |  timestamp   |          |     x    |         | The date on which the mission was\
    \ validated  |\n|`reason_noncompliant`           |  string      |          |          |         |\
    \ The reason provided by the area manager to explain why the mission was marked noncompliant |\n|`republished_with_answers`\
    \      |  boolean     |          |     x    |         | Has the mission been repulished with the previous\
    \ answers after being marked noncompliant |\n|`original_mission_id`           |  string      |   \
    \       |     x    |         | If present, the `mission_id` of the mission that this mission was republished\
    \ from |\n|`original_reason_noncompliant`  |  string      |          |     x    |         | The `reason_noncompliant`\
    \ from the original mission that was republished. |\n|`updated_date`                  |  timestamp\
    \   |          |     x    |    x    | Mission's last update date  |\n|`created_date`             \
    \     |  timestamp   |          |     x    |         | Mission's creation date     |\n|`answers` \
    \                      |  array       |          |          |         | Mission's questions and answers,\
    \ if misssion is finished (see below) |\n|`group_ids`                     |  array       |       \
    \   |          |         | Group ids that can see this mission |\n|`user_ids`                    \
    \  |  array       |          |          |         | User ids that can see this mission |\n|`action_plan_progress`\
    \          |  number      |          |     x    |         | Completion rate of an action plan.   \
    \   |\n|`task_number`                   |  number      |          |     x    |         | Auto generated\
    \ when a new mission is created. The value is unique within a campaign      |\n\n**Important**:  \
    \  \nPlease note that to retrieve the value of the answers for a specific mission, you will need to\
    \ use the single mission endpoint.\n\nThe `answers` field is defined as an array of:\n| Field    \
    \            | Type           | Description               |\n|----------------------|----------------|---------------------------|\n\
    |`question_id`         |  string        | Unique id of the question |\n|`question_type`       |  string\
    \        | The type of the question  |\n|`question`            |  string        | The title of the\
    \ question |\n|`page_number`         |  number        | The number of the page the question appears\
    \ in |\n|`question_number`     |  number        | The number of the question on the page |\n|`answer`\
    \              |  string        | The value of the answer |"
  humanURL: https://docs.yoobic.com/api.html
  baseURL: https://api.yoobic.com/public/api
  tags:
  - Missions
  properties:
