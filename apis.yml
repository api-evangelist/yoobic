- aid: yoobic:yoobic-questions-api
  name: Yoobic Questions API
  description: "<a id=\"group-questions\"></a>\nQuestions are a Social Learning feature, allowing users\
    \ to learn tips / expertise from each other. They can ask questions and others can reply to them.\
    \ Admins and managers can “verify” some answers to make the response official. Essentially, Questions\
    \ section acts as a forum where knowledge can be shared across the company.\n\n### Fields\n\n| Field\
    \                | Type        | Required | Readonly   | OrderBy | Description               |\n|----------------------|:-----------:|:--------:|:----------:|:-------:|---------------------------|\n\
    |`question_id`         |  string     |    x     |     x      |         | Unique id of the question\
    \ |\n|`title`               |  string     |          |     x      |         | Title of the question\
    \ |\n|`description`         |  string     |          |     x      |         | Description of the question\
    \ |\n|`user_id`             |  string     |          |     x      |         | User id creating the\
    \ question |\n|`is_wiki`             |  boolean    |          |     x      |         | Whether or\
    \ not the question exists in the knowledge base | \n|`is_verified`         |  boolean    |       \
    \   |     x      |         | Whether or not this is a verified question | \n|`likes`             \
    \  |  number     |          |     x      |         | Likes count | \n|`answers`             |  number\
    \     |          |     x      |         | Answers count | \n|`bookmarks`           |  number     |\
    \          |     x      |         | Number of users who bookmarked the question | \n|`tags`      \
    \          |  array      |          |     x      |         | List of tags        |\n|`image`     \
    \          |  string     |          |     x      |         | The url to the image  |\n|`created_date`\
    \        |  date       |          |     x      |         | Creation date             |\n|`updated_date`\
    \        |  date       |          |     x      |    x    | Last update date          |"
