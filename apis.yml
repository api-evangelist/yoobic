- aid: yoobic:yoobic-notifications-api
  name: Yoobic Notifications API
  description: >-
    <a id="group-notifications"></a>

    Notifications provide information about the internal notifications sent to users in the application.


    ### Fields


    | Field                | Type           | Required | Readonly | OrderBy | Description               |

    |----------------------|:--------------:|:--------:|:--------:|:-------:|---------------------------|

    |`notification_id`     |  string        |    x     |    x     |         | Unique id of the notification     |

    |`title`               |  string        |    x     |          |         | The title of notification         |

    |`mode`                |  string        |          |          |         | The way in which the notification
    is sent. Possible values (`push`, `email`, `all`) |

    |`body`                |  string        |    x     |          |         | Notification body |

    |`user_ids`            |  array         |    x     |          |         | Target user ids to send
    the notification |

    |`group_ids`           |  array         |          |          |         | Send notification to all
    users in group_ids, but not to users from imbricated groups  |

    |`badge_type`          |  string        |          |    x     |         | Specifies which badge in
    the Operations or Boost app should be incremented for recipients of this notification |

    |`sender_id`           |  string        |          |    x     |         | Unique id of the user triggering
    the notification |

    |`push_recipients`     |  number        |          |    x     |         | Number of recipients    |

    |`entity_type`         |  string        |          |          |         | The entity's type for which
    the notification was created. Possible values (`missions`, `news`, `campaigns`) |

    |`entity_id`           |  string        |          |          |         | The unique id of the entity
    |

    |`created_date`        |  date          |          |    x     |         | Creation date   |

    |`updated_date`        |  date          |          |    x     |    x    | Last update date |


    **Important**:


    - `entity_type` and `entity_id` are used to redirect the user once he/she click on the notification.


    - `group_ids` is used only when creating the notification. Therefore, it won't be provided on the
    response. Instead, all the recipients.


    - There is a limit of 50k notifications. If you need to send more than this, you can split the recipients
    in separate requests targetting different groups.
