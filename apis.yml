- aid: yoobic:yoobic-webhooks-api
  name: Yoobic Webhooks API
  description: "<a id=\"group-webhooks\"></a>\nYou can create webhooks with HTTP targets to build integrations\
    \ with the services or with your back-end system. Examples:\n\n- Alert your team in Slack when a mission\
    \ is created\n\n- Pass mission to your docs team in Asana after a mission is completed\n\n- Update\
    \ Salesforce when a new store is created\n\nAn HTTP target lets you pass information to third-party\
    \ services and REST APIs that accept JSON in HTTP requests.\n\nThe list of topics supporting webhooks\
    \ are:\n\n- campaigns\n\n- courses\n\n- events\n\n- files\n\n- lessons\n\n- mission-workflows\n\n\
    - missions\n\n- mission-comments\n\n- mission-services\n\n- store-types\n\n- stores\n\n- users\n\n\
    - visits\n\n- webhooks\n\n- For visits, the `delete` action is not supported. To receive deleted visit\
    \ objects you need to subscribe to the `missions` topic. The deleted visits are sent as their corresponding\
    \ `mission` object as a visit is a sub-type of missions.\n\n- For mission-comments, only `create`\
    \ and `update` actions are supported.    \nSee example use case [here](https://yoobic.zendesk.com/hc/en-gb/articles/14909941328274-Ticketing-System-Integration-Setup-Guide-Synchronise-Requests-and-Comments-With-External-Tickets#h_01HEJEZ7VEZSGHBCZH7C569T8A).\n\
    \n- For mission-services, only `create` and `update` actions are supported.    \nSee example use case\
    \ [here](https://yoobic.zendesk.com/hc/en-gb/articles/14909941328274-Ticketing-System-Integration-Setup-Guide-Synchronise-Requests-and-Comments-With-External-Tickets#h_01HEJCJBH9B9G62R79FBGKA29N).\n\
    \n- If the webhook has a filter, the webhook will fire only once per object when it matches the filter\
    \ the first time. For example, if the webhook is on topic `missions` , operations `update` and the\
    \ filter is `{\"status\": \"finished\"}`, then each mission will trigger a new message only when it\
    \ is `finished`. If another update happens later, to validate the mission for example, it will not\
    \ fire a new message.\n\n- To send multiple messages for the same object and operation, set `trigger_on_every_match`\
    \ to true. For example if you want to track every update for `mission-workflows` for every step of\
    \ the workflow.\n\n- On mission-workflows, possible to filter on `step_title` and `state`. Both can\
    \ be used together to **only** fire the webhook when a step is reached. Otherwise, having only a filter\
    \ on `step_title` results in the webhook firing twice when the step is reached due to the mission\
    \ being updated when it is assigned to a user.\n\n- The object output of mission-workflows contains\
    \ the same fields as for a regular mission, with an addition of `workflow_step_title`, `workflow_step_id`\
    \ and `workflow_state`.\n\n#### Errors\n\nIf a webhook fails it becomes inactive. In addition a failure\
    \ object with the http status and reason are set on the webhook's object.\n\n```\n  {\n      \"is_active\"\
    : false\",\n      \"error\": {\n        \"status\": 404,\n        \"message\": \"Not Found.\"\n  \
    \    }\n  }\n  ```\n\nOnce the webhook becomes active again, the error object will be cleared.   \
    \ \ni.e. a PATCH request to fix the broken webhook:\n\n```\n  {\n    \"is_active\": true,\n    \"\
    url\": \"<new working callback url>\"\n  } \n  ```\n\n#### Callback response body\n\nThe callback\
    \ url will have the following fields -\n\n- action: create/update/delete\n\n- topic: one of the supported\
    \ topics i.e. store-types\n\n- data: the actual entity\n\n- updatedFields: list of fields that were\
    \ updated \n  ```\n  {\n      \"action\": \"update\",\n      \"topic\": \"store-types\",\n      \"\
    data\": {\n          \"store_type_id\": \"56b0c262e9a22a4e5f02be7d\",\n          \"name\": \"ice-cream\"\
    ,\n          \"group_ids\": [\"managers\"],\n          \"created_date\": \"2016-02-02T14:51:14.644Z\"\
    ,\n          \"updated_date\": \"2020-07-15T14:18:41.750Z\"\n      },\n      \"updatedFields\": [\n\
    \        \"group_ids\"\n      ]\n  }\n  ```\n\n#### Security\n\nWebhooks provide an additional security\
    \ measure to verify that the webhook is genuine and has come from YOOBIC. \n  This can be useful if\
    \ you're looking to ensure only YOOBIC webhooks are being made to your endpoint and ensure the information\
    \ is genuine and as the system expects. These signatures will also help prevent against replay attacks.\
    \ Verifying the signing secret is optional.\n  When registering a webhook you can set an additional\
    \ `secret` field in the payload.\n  Webhook requests will contain two headers which can be used to\
    \ verify the request's authenticity:\n\n- `x-yoobic-webhook-signature` - the main signature\n\n- `x-yoobic-webhook-signature-timestamp`\
    \ - the timestamp used to verify the signature\n  This is used in conjunction with the payload of\
    \ the request (if there is one).\n\n  Verifying the signature    \n  Sign the body and signature timestamp\
    \ with the webhook secret key using SHA256, then base64 encoding the resulting digest.\n\n  Represented\
    \ simply: base64(HMACSHA256(TIMESTAMP + BODY))\n\n  To verify the signature, create the same SHA256\
    \ HMAC signature and then compare it to the webhook payload to ensure that they match. If they match,\
    \ then you can be sure that the webhook came from YOOBIC. If they don't, it may be a request from\
    \ another source.\n\n\n  Here is an example of a verification signature function in nodejs\n\n\n \
    \ ```js\n  const crypto = require('crypto');\n  const SIGNING_SECRET = <the secret you used when registering\
    \ the webhook>\n  function isValidSignature(signature, body, timestamp) {\n    let hmac = crypto.createHmac('sha256',\
    \ SIGNING_SECRET);\n    let sig = hmac.update(timestamp + body).digest(\"base64\");\n\n    return\
    \ (\n      Buffer.compare(\n        Buffer.from(signature),\n        Buffer.from(sig.toString(\"base64\"\
    ))\n      ) === 0\n    );\n  }\n\n  // assuming you have access to the HTTP request (req) object your\
    \ webhook endpoint has been called with\n  const signature = req.headers[\"x-yoobic-webhook-signature\"\
    ];\n  const timestamp = req.headers[\"x-yoobic-webhook-signature-timestamp\"];\n  const raw_body =\
    \ JSON.stringify(req.body);\n\n  const isValid = isValidSignature(signature, raw_body, timestamp)\n\
    \  if (isValid) {\n    console.log(\"HMAC signature is valid\");\n  } else {\n    console.log(\"HMAC\
    \ signature is invalid\");\n  }\n  ```\n\n#### Webhooks and sandbox\n\nYou can create webhooks in\
    \ the sandbox environment but they are automatically removed every week when the sandbox environment\
    \ is refreshed.\n  Active webhooks in production are not copied to the sandbox environment during\
    \ the weekly sandbox refresh.\n\n### Fields\n\n| Field                | Type           | Required\
    \ | Readonly | OrderBy | Description               |\n|----------------------|:--------------:|:--------:|:--------:|:-------:|---------------------------|\n\
    |`webhook_id`          |  string        |          |     x    |         | Unique webhook id      \
    \   |\n|`url`                 |  string        |     x    |          |         | Unique http target\
    \ url    |\n|`topics`              |  array         |          |          |         | A list of entities\
    \ to listen for (default: all)|\n|`operations`          |  array         |          |          | \
    \        | A list of operations to listen for [\"create\", \"update\", \"delete\"] (default: all)|\n\
    |`is_active`           |  boolean       |          |          |         | enable or disable this webhook\
    \ (default: true)         |\n|`trigger_on_every_match`|  boolean     |          |          |     \
    \    | Specifies if an object should trigger the webhook on every match or only once |\n|`has_secret`\
    \          |  boolean       |          |    x     |         | True if secret has been provided   \
    \      |\n|`error`               |  object        |          |    x     |         | A description\
    \ object (http status, message) to the reason this webhook is inactive         |\n|`secret`      \
    \        |  string        |          |          |         | Encryption key         |\n|`created_date`\
    \        |  date          |          |     x    |         | Creation date             |\n|`updated_date`\
    \        |  date          |          |     x    |    x    | Last update date          |"
