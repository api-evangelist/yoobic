- aid: yoobic:yoobic-bot-messages-api
  name: Yoobic Bot Messages API
  description: >-
    <a id="group-bot_messages"></a>

    Bot analytics allow you to improve your bots by understanding how your teams use them and how satisfied
    they are with the answers. The key metrics available can be used to monitor the usage of the feature
    and to analyze frequent questions where knowledge is lacking in order to create new content and add
    it to the NEO Chatbot sources.


    ### Fields


    | Field | Type | Required | Readonly | OrderBy | Description |

    |-------|:----:|:--------:|:--------:|:-------:|-------------|

    |`bot_id`| string | | x | | Unique id of the bot |

    |`bot_message_id`| string | | x | | Unique if of the message sent to the bot |

    |`user_id`| string | | x | | Unique id of the user that sent the question |

    |`username`| string | | x | | Username of the user that sent the question |

    |`question`| string | | x | | Question of the user |

    |`answer`| string | | x | | Answer of the bot to the question of the user |

    |`feedback`| boolean | | x | | True if the user put a ‘thumbs up’ and false if the user put a ‘thumbs
    down' on the answer of the bot |

    |`answered`| boolean | | x | | True if the question was answered and false if it wasn’t (equivalent
    to ‘I don’t know' response from the bot') |

    |`created_date`| date | | x | | Created Date |

    |`updated_date`| date | | x | | Updated Date |
