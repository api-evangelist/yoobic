- aid: yoobic:yoobic-chats-api
  name: Yoobic Chats API
  description: >-
    <a id="group-chats"></a>

    Chats are used for internal communication between users directly in the YOOBIC app.


    ### Fields


    | Field | Type | Required | Readonly | OrderBy | Description |

