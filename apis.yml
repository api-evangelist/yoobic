- aid: yoobic:yoobic-geofilters-api
  name: Yoobic Geofilters API
  description: >-
    <a id="group-geofilters"></a>

    provides a mapping between users and the stores they have permission to visit


    - Each user may have more than one store mapped. If enabled, users could only book missions to the
    specified stores.


    - Geographic filters are extremely important in Operations. They are what control which stores a user
    can or can't see.


    - Geographic filters are assigned to stores and store types.


    - There are two types of geographic filters: non-dynamic and dynamic. Non dynamic filters are made
    by attaching stores to a user, dynamic filters are made by attaching store types to a user.

    <img src="https://user-images.githubusercontent.com/31584145/46032347-06a05180-c104-11e8-87f3-1bddb628a90c.png">


    - With the exception of Stores, geographic filters should always be dynamic. This is because it is
    easier to add a store to a type so that it inherits its geographic filter than it is to add a store
    to each geographic filter it needs to be in.


    ### Fields


    | Field                | Type           | Required | Readonly | OrderBy | Description               |

    |----------------------|:--------------:|:--------:|:--------:|:-------:|---------------------------|

    |`geofilter_id`        |  string        |     x    |    x     |         | Unique geofilter id       |

    |`user_id`             |  string        |     x    |          |    x    | Unique user id            |

    |`store_ids`           |  array         |          |          |    x    | Unique store ids           |

    |`store_client_ids`    |  array         |          |          |         | External unique ids of the
    stores as it may exists in your Information System|

    |`store_type_names`    |  array         |          |          |         | The names of the store types
    |

    |`store_type_ids`      |  array         |          |          |    x    | The ids of the store types
    |

    |`created_date`        |  date          |          |    x     |         | Created Date |

    |`updated_date`        |  date          |          |    x     |    x    | Updated Date |


    One of either fields is required in order to resolve the mapping between a user and store/s:


    - store_ids


    - store_client_ids


    - store_type_ids


    - store_type_names
