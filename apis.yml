- aid: yoobic:yoobic-visits-api
  name: Yoobic Visits API
  description: "<a id=\"group-visits\"></a>\nThrough this endpoint the details and/or the approval of\
    \ the visit could be set.    \nBy default, the visits will be shown as pending until they are approved\
    \ (`compliant`).    \nBelow is an example of a typical way of scheduling a visit:\n\n<img src=\"https://res.cloudinary.com/www-yoobic-com/image/upload/v1568034036/ympswsz9y1j0ziaddexu.png\"\
    \ >\n\n### Fields\n\n<a id=\"group-visits-fields\"></a>\n| Field                          | Type \
    \        | Required | Readonly | OrderBy | Description     |\n|--------------------------------|--------------|:--------:|:--------:|:-------:|-----------------|\n\
    |`visit_id`                      |  string      |          |     x    |         | Unique id of the\
    \ visit  |\n|`user_id`                       |  string      |     x    |          |    x    | Unique\
    \ id of the user who will visit the store  |\n|`store_id`                      |  string      |  \
    \   x    |          |    x    | Unique id of the associated store  |\n|`group_ids`               \
    \      |  timestamp   |     x    |          |         | Group ids that can see this visit  |\n|`user_ids`\
    \                      |  array       |          |          |         | User ids that can see this\
    \ visit|\n|`start_time`                    |  string      |          |          |         | The scheduled\
    \ time of the visit. Format is HH:mm |\n|`end_time`                      |  string      |        \
    \  |          |         | The end time of the visit. Format is HH:mm |\n|`visit_date`            \
    \        |  date        |     x    |          |         | The scheduled date of the visit. Format\
    \ is YYYY-MM-DD |\n|`compliant`                     |  boolean     |          |          |       \
    \  | The compliance of the visit as marked by an area manager: `true` if marked compliant, `false`\
    \ if marked noncompliant |\n|`type`                          |  string      |          |         \
    \ |         | Type of the visit chosen among a predefined list             |\n|`description`     \
    \              |  string      |          |          |         | Description of the visit  |\n|`creator_id`\
    \                    |  string      |          |     x    |    x    | Unique id of the visit creator\
    \  |\n|`custom_fields`                 |  object      |          |          |         | Dynamic properties\
    \ (optional)|\n|`updated_date`                  |  timestamp   |          |     x    |    x    | Visit's\
    \ last update date  |\n|`created_date`                  |  timestamp   |          |     x    |   \
    \      | Visit's creation date     |\n\n**Important:**\n\n`custom_fields` contains new attributes\
    \ that can be used to describe more precisely a user.    \nCustom fields provide a new way to customize\
    \ your user data by allowing you to filter and select the relevant data in the application.    \n\
    You can create your own custom fields in the YOOBIC Web Application in order to enrich your user data.\
    \    \nFor the full list of supported field types see [campaigns](#group-campaigns-question-types)"
